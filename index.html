                                                <option value="BankaDopis">Opšti dopis banki (Bankaya Genel Dilekçe)</option>
                                                <option value="DevletDopis">Zahtjev državnim organima (Devlet Dairesine Başvuru)</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted small fw-bold">Belge Tarihi *</label>
                                            <input type="date" class="form-control" id="y_tarih" required>
                                        </div>
                                    </div>

                                    <!-- DİNAMİK SEÇİM ALANLARI -->
                                    <div class="p-3 bg-light rounded border border-secondary border-opacity-25 mb-3">
                                        <h6 class="text-primary fw-bold mb-2 small"><i class="fas fa-sliders-h me-1"></i> Otomatik Doldurma Parametreleri (Banka & Cari)</h6>
                                        <div class="row g-2">
                                            <div class="col-md-5">
                                                <label class="form-label text-muted small mb-1">Gönderen Banka Hesabımız</label>
                                                <select class="form-select form-select-sm" id="y_bankaId" onchange="yazismaSablonSec()"></select>
                                            </div>
                                            <div class="col-md-4">
                                                <label class="form-label text-muted small mb-1">Alıcı Cari Hesap (Kime)</label>
                                                <select class="form-select form-select-sm" id="y_cariId" onchange="yazismaMaasTutarOtomatikDoldur(); yazismaSablonSec()"></select>
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label text-muted small mb-1">İşlem Tutarı (€)</label>
                                                <input type="number" class="form-control form-control-sm" id="y_tutar" step="0.01" placeholder="1000.00" onkeyup="yazismaSablonSec()" onchange="yazismaSablonSec()">
                                            </div>
                                        </div>

                                        <!-- MAAŞ ÖDEMESİ SEÇENEĞİ (SADECE EFT SEÇİLİNCE GÖRÜNÜR) -->
                                        <div class="row g-2 mt-2 pt-2 border-top align-items-center" id="y_maas_alani" style="display: none;">
                                            <div class="col-md-5">
                                                <div class="form-check form-switch pt-1">
                                                    <input class="form-check-input" type="checkbox" id="y_isMaas" onchange="yazismaMaasToggle(); yazismaMaasTutarOtomatikDoldur(); yazismaSablonSec();">
                                                    <label class="form-check-label small fw-bold text-dark" for="y_isMaas"><i class="fas fa-money-check-alt text-success me-1"></i> Maaş Ödemesi Talimatı</label>
                                                </div>
                                            </div>
                                            <div class="col-md-7" id="y_maas_donem_div" style="display: none;">
                                                <div class="d-flex align-items-center">
                                                    <label class="form-label text-muted small me-2 mb-0 white-space-nowrap">Maaş Dönemi:</label>
                                                    <input type="month" class="form-control form-control-sm" id="y_maasDonem" onchange="yazismaSablonSec()">
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label text-muted small fw-bold">Muhatap Kurum / Banka Adı *</label>
                                            <input type="text" class="form-control" id="y_kurum" placeholder="Npr: Hipotekarna Banka AD Podgorica" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted small fw-bold">Konu / Predmet *</label>
                                            <input type="text" class="form-control" id="y_konu" placeholder="Npr: Zahtjev za izdavanje potvrde" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label text-muted small fw-bold">Dilekçe / Talimat Metni (Karadağca) *</label>
                                        <textarea class="form-control font-monospace text-dark" id="y_metin" rows="9" style="font-size: 13px; line-height: 1.6;" placeholder="Poštovani, Obraćamo vam se sa zahtjevom..." required></textarea>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer bg-light">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                                <button type="button" class="btn btn-primary px-4 fw-bold" onclick="yazismaKaydet()">Kaydet</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => { if(typeof window.yazismalariCiz === 'function') window.yazismalariCiz(); }, 50);
        }

        else if(sayfa === 'ai_asistan') {
            const hasApiKey = localStorage.getItem("ev_gemini_api_key") ? true : false;
            
            mainContent.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="text-dark fw-bold"><i class="fas fa-robot text-warning me-2"></i>AI Mevzuat Asistanı</h2>
                </div>

                <!-- API KEY GİRİŞ ALANI -->
                <div class="card shadow-sm mb-4 border-warning ${hasApiKey ? 'd-none' : ''}" id="ai_ayar_alani">
                    <div class="card-body bg-light">
                        <h5 class="text-danger"><i class="fas fa-lock"></i> Sistemin Kurulumu Gerekli</h5>
                        <p class="text-muted small">Asistanın çalışabilmesi için ücretsiz Google Gemini API anahtarına ihtiyacınız var. Bu anahtar sadece sizin tarayıcınızda kalır, kimseyle paylaşılmaz.</p>
                        <div class="input-group">
                            <input type="text" id="ai_api_key" class="form-control" placeholder="AIzaSy... ile başlayan anahtarınızı buraya yapıştırın">
                            <button class="btn btn-primary" onclick="geminiApiKaydet()">Kaydet ve Başlat</button>
                        </div>
                        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="small mt-2 d-inline-block">Ücretsiz API Anahtarı Almak İçin Tıklayın</a>
                    </div>
                </div>

                <div class="row ${!hasApiKey ? 'd-none' : ''}" id="ai_sohbet_alani">
                    <!-- SOL PANEL: Mini Rehber ve Hızlı Butonlar -->
                    <div class="col-md-4 mb-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                                <h6 class="fw-bold text-uppercase mb-0" style="color:#2c3e50; font-size: 0.75rem;"><i class="fas fa-book me-2"></i>Karadağ Finansal Özeti</h6>
                            </div>
                            <div class="card-body">
                                <ul class="list-group list-group-flush small text-muted mb-4">
                                    <li class="list-group-item px-0 py-2 border-light"><i class="fas fa-check text-success me-2"></i><strong>PDV (KDV) Sınırı:</strong> Yıllık 30.000 € altı muaf.</li>
                                    <li class="list-group-item px-0 py-2 border-light"><i class="fas fa-check text-success me-2"></i><strong>Kurumlar Vergisi:</strong> 100K€'ya kadar %9, 1.5M€'ya kadar %12, üstü %15.</li>
                                    <li class="list-group-item px-0 py-2 border-light"><i class="fas fa-check text-success me-2"></i><strong>Hizmet İhracatı:</strong> Yurt dışı faturalar %0 KDV.</li>
                                    <li class="list-group-item px-0 py-2 border-light"><i class="fas fa-info-circle text-primary me-2"></i><strong>Asgari Maaş:</strong> Lise 600 €, Üniversite 800 € net.</li>
                                    <li class="list-group-item px-0 py-2 border-light"><i class="fas fa-exclamation-circle text-danger me-2"></i><strong>Doprinosi (SGK):</strong> Aylık ~125 € (Ayın 15'ine kadar).</li>
                                </ul>
                                
                                <h6 class="fw-bold text-uppercase mb-3" style="color:#2c3e50; font-size: 0.75rem;"><i class="fas fa-bolt text-warning me-2"></i>Hızlı Asistan Sorguları</h6>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-outline-secondary btn-sm text-start" onclick="hizliSoruSor('Karadağ güncel asgari ücret ve aylık şirket direktörü Doprinosi (SGK) ödemeleri hakkında bilgi ver.')"><i class="fas fa-search me-2"></i>Güncel Doprinosi ve Maaşlar</button>
                                    <button class="btn btn-outline-secondary btn-sm text-start" onclick="hizliSoruSor('Karadağ dışındaki müşterilere kesilen danışmanlık faturaları (Hizmet İhracatı) için KDV (PDV) mevzuatını özetle.')"><i class="fas fa-search me-2"></i>Hizmet İhracatı Mevzuatı</button>
                                    <button class="btn btn-outline-secondary btn-sm text-start" onclick="hizliSoruSor('Türkiye ve Karadağ arasındaki çifte vergilendirmeyi önleme anlaşmasının temel şartlarını açıkla.')"><i class="fas fa-search me-2"></i>Çifte Vergilendirme (TR-ME)</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- SAĞ PANEL: Sohbet Ekranı -->
                    <div class="col-md-8 mb-4">
                        <div class="card shadow-sm border-0 h-100 d-flex flex-column">
                            <div class="card-body" id="ai_cevap_ekrani" style="flex: 1; overflow-y: auto; background-color: #f8fafc; border-radius: 8px 8px 0 0; min-height: 400px; max-height: 550px;">
                                <div class="text-center text-muted mt-5 mb-4">
                                    <i class="fas fa-shield-alt fa-3x mb-3 text-primary opacity-50"></i><br>
                                    <h6 class="text-dark fw-bold">Euro Veritas Akıllı Ajanına Hoş Geldiniz</h6>
                                    Karadağ yasaları, AB uyum süreçleri veya şirket yönetimi hakkında sorular sorabilir<br>ya da yandaki hızlı sorgu butonlarını kullanabilirsiniz.
                                </div>
                            </div>
                            <div class="card-footer bg-white border-top p-3" style="border-radius: 0 0 8px 8px;">
                                <div class="input-group">
                                    <textarea id="ai_soru" class="form-control bg-light border-0" placeholder="Örn: Karadağ'da yeni bir yabancı işçi çalıştırmanın maliyeti nedir?" rows="2" style="resize:none; box-shadow:none;"></textarea>
                                    <button class="btn btn-primary px-4" id="ai_soru_buton" onclick="geminiSoruSor()">
                                        <i class="fas fa-paper-plane me-1"></i> Gönder
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => { if(typeof window.aiGecmisCiz === 'function') window.aiGecmisCiz(); }, 50);
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
