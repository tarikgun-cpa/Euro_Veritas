<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Veritas Doo - Montenegro</title>
    <link rel="icon" type="image/x-icon" href="EV_Logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px 20px; display: block; border-bottom: 1px solid #34495e; transition: 0.3s; }
        .sidebar a:hover { background-color: #34495e; padding-left: 25px; }
        .sidebar a i { margin-right: 10px; width: 20px; text-align: center; }
        .content-area { padding: 20px; }
        
        #login-container { min-height: 100vh; background-color: #2c3e50; }
        .login-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="login-container" class="d-flex justify-content-center align-items-center">
    <div class="card p-5 login-card bg-white" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <img src="Euro Veritas Consulting.jpg" alt="Euro Veritas Logo" style="max-width: 180px; height: auto; margin-bottom: 15px; border-radius: 10px;">
            <h4 class="text-primary fw-bold mb-0">Yönetici Paneli</h4>
        </div>
        <div id="login-error" class="alert alert-danger d-none text-center" style="font-size: 14px;"></div>
        <div class="mb-3">
            <label class="form-label text-muted small">E-Posta Adresi</label>
            <input type="email" id="login-email" class="form-control form-control-lg" placeholder="ornek@euroveritas.com">
        </div>
        <div class="mb-4">
            <label class="form-label text-muted small">Şifre</label>
            <input type="password" id="login-password" class="form-control form-control-lg" placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="girisYap()">Sisteme Giriş Yap</button>
    </div>
</div>

<!-- ANA UYGULAMA -->
<div class="container-fluid d-none" id="app-container">
    <div class="row">
        <!-- Sol Menü -->
        <div class="col-md-2 p-0 sidebar shadow">
            <div class="p-3 text-center border-bottom border-secondary mb-3" style="background-color: #ffffff;">
                <img src="Euro Veritas Consulting.jpg" alt="Euro Veritas Logo" style="max-width: 100%; height: auto; border-radius: 8px;">
            </div>
            <a href="#" onclick="sayfaYukle('dashboard')"><i class="fas fa-chart-line"></i> Yönetici Özeti</a>
            <a href="#" onclick="sayfaYukle('faturalar')"><i class="fas fa-file-invoice-dollar"></i> Faturalar</a>
            <a href="#" onclick="sayfaYukle('cariler')"><i class="fas fa-users"></i> Cari Hesaplar</a>
            <a href="#" onclick="sayfaYukle('bankalar')"><i class="fas fa-university"></i> Banka Hesapları</a>
            <a href="#" onclick="sayfaYukle('vergiler')"><i class="fas fa-landmark"></i> Vergi Ödemeleri</a>
            <a href="#" onclick="sayfaYukle('gorevler')"><i class="fas fa-tasks"></i> Görevler</a>
            <a href="#" onclick="sayfaYukle('kunye')"><i class="fas fa-building"></i> Şirket Künyesi</a>
            <a href="#" onclick="sayfaYukle('ai_asistan')" class="text-warning fw-bold"><i class="fas fa-robot"></i> AI Mevzuat Asistanı</a>
            <a href="#" class="mt-5 text-warning" onclick="cikisYap()"><i class="fas fa-sign-out-alt"></i> Güvenli Çıkış</a>
        </div>

        <!-- Ana İçerik Alanı -->
        <div class="col-md-10 content-area" id="main-content"></div>
    </div>
</div>

<!-- Firebase SDK'ları -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  // YENİ: Firebase Firestore kütüphanesine "doc" ve "updateDoc" eklendi (Bakiye güncellemek için)
  import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, increment, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

  const firebaseConfig = {
    // BURAYA KENDİ BİLGİLERİNİZİ YAPIŞTIRIN
    apiKey: "AIzaSyBOFBkfoLHyMEA5AsRVPmz8RMuyP2C3Sis",
  authDomain: "euroveritasdoo.firebaseapp.com",
  databaseURL: "https://euroveritasdoo-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "euroveritasdoo",
  storageBucket: "euroveritasdoo.firebasestorage.app",
  messagingSenderId: "789464136176",
  appId: "1:789464136176:web:49808ec9e92e7c11608535"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app); 

  let cariListesi = [];
  let faturaListesi = []; // YENİ: Faturaları tutacak dizi
  let cariDinleyici = null; 
  let faturaDinleyici = null; // YENİ: Fatura dinleyici
  let bankaListesi = [];
  let bankaDinleyici = null;
  let vergiListesi = [];
  let vergiDinleyici = null;
  let gorevListesi = [];
  let gorevDinleyici = null;
  let kunyeDinleyici = null;
  let kunyeVerisi = {};
  let islemListesi = []; // Banka hareketleri için

  onAuthStateChanged(auth, (user) => {
      if (user) {
          document.getElementById('login-container').classList.add('d-none');
          document.getElementById('login-container').classList.remove('d-flex');
          document.getElementById('app-container').classList.remove('d-none');
          
          sayfaYukle('dashboard');

          // CARİLERİ DİNLE
          cariDinleyici = onSnapshot(collection(db, "cariler"), (snapshot) => {
              cariListesi = [];
              snapshot.forEach((doc) => { cariListesi.push({ id: doc.id, ...doc.data() }); });
              if (document.getElementById('cariTabloGövdesi')) { window.tabloyuCiz(); }
              if (document.getElementById('dash_kasa')) { window.dashboardCiz(); } // YENİ: Dashboard anında güncellensin
          });

          // FATURALARI DİNLE
          faturaDinleyici = onSnapshot(collection(db, "faturalar"), (snapshot) => {
              faturaListesi = [];
              snapshot.forEach((doc) => { faturaListesi.push({ id: doc.id, ...doc.data() }); });
              faturaListesi.sort((a,b) => new Date(b.tarih) - new Date(a.tarih));
              if (document.getElementById('faturaTabloGövdesi')) { window.faturalariCiz(); }
          });

          // BANKALARI DİNLE
          bankaDinleyici = onSnapshot(collection(db, "bankalar"), (snapshot) => {
              bankaListesi = [];
              snapshot.forEach((doc) => { bankaListesi.push({ id: doc.id, ...doc.data() }); });
              if (document.getElementById('bankaTabloGövdesi')) { window.bankalariCiz(); }
              if (document.getElementById('dash_kasa')) { window.dashboardCiz(); } // YENİ: Dashboard anında güncellensin
          });

          // VERGİLERİ DİNLE (YENİ)
          vergiDinleyici = onSnapshot(collection(db, "vergiler"), (snapshot) => {
              vergiListesi = [];
              snapshot.forEach((doc) => { vergiListesi.push({ id: doc.id, ...doc.data() }); });
              // Tarihe göre sırala (Yaklaşan en üstte)
              vergiListesi.sort((a,b) => new Date(a.sonTarih) - new Date(b.sonTarih));
              if (document.getElementById('vergiTabloGövdesi')) { window.vergileriCiz(); }
          });

          // GÖREVLERİ DİNLE (YENİ)
          gorevDinleyici = onSnapshot(collection(db, "gorevler"), (snapshot) => {
              gorevListesi = [];
              snapshot.forEach((doc) => { gorevListesi.push({ id: doc.id, ...doc.data() }); });
              gorevListesi.sort((a,b) => new Date(a.sonTarih || '2099') - new Date(b.sonTarih || '2099'));
              if (document.getElementById('gorevListesiAlani')) { window.gorevleriCiz(); }
          });

          // KÜNYE DİNLE (YENİ)
          kunyeDinleyici = onSnapshot(doc(db, "ayarlar", "kunye"), (docSnap) => {
              if (docSnap.exists()) { kunyeVerisi = docSnap.data(); } 
              else { kunyeVerisi = {}; }
              if (document.getElementById('kunyeKarti')) { window.kunyeCiz(); }
          });

      } else {
          document.getElementById('app-container').classList.add('d-none');
          document.getElementById('login-container').classList.remove('d-none');
          document.getElementById('login-container').classList.add('d-flex');
          
          if(cariDinleyici) cariDinleyici(); 
          if(faturaDinleyici) faturaDinleyici(); 
      }
  });

  window.girisYap = async function() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const hataKutusu = document.getElementById('login-error');
      if(email === "" || pass === "") { hataKutusu.innerHTML = "E-posta ve şifre zorunludur."; hataKutusu.classList.remove('d-none'); return; }
      try { await signInWithEmailAndPassword(auth, email, pass); hataKutusu.classList.add('d-none'); } 
      catch (error) { hataKutusu.innerHTML = "Giriş başarısız."; hataKutusu.classList.remove('d-none'); }
  };

  window.cikisYap = async function() {
      await signOut(auth);
      document.getElementById('login-email').value = ""; document.getElementById('login-password').value = "";
  };

  // ---------------- YÖNETİCİ ÖZETİ (DASHBOARD) HESAPLAMALARI ----------------
  window.dashboardCiz = function() {
      // Ekranda dashboard kartları yoksa (başka sayfadaysak) boşuna yorulma
      if(!document.getElementById('dash_kasa')) return;

      let toplamKasa = 0;
      let toplamAlacak = 0;
      let toplamBorc = 0;

      // 1. Kasadaki Parayı Hesapla
      bankaListesi.forEach(banka => {
          toplamKasa += (banka.bakiye || 0);
      });

      // 2. Cari Bakiyeleri Hesapla (Artı ise Müşteri bize borçlu=Alacak, Eksi ise Biz borçluyuz=Borç)
      cariListesi.forEach(cari => {
          let bakiye = cari.bakiye || 0;
          if(bakiye > 0) {
              toplamAlacak += bakiye;
          } else if(bakiye < 0) {
              toplamBorc += Math.abs(bakiye); // Eksi işareti kaldırarak (mutlak değer) topla
          }
      });

      // 3. Ekrana Yazdır
      document.getElementById('dash_kasa').innerHTML = toplamKasa.toFixed(2) + " €";
      document.getElementById('dash_alacak').innerHTML = toplamAlacak.toFixed(2) + " €";
      document.getElementById('dash_borc').innerHTML = toplamBorc.toFixed(2) + " €";
  };

  // ---------------- CARİ İŞLEMLERİ ----------------
  window.tabloyuCiz = function() {
      const tbody = document.getElementById('cariTabloGövdesi');
      if (!tbody) return; 
      tbody.innerHTML = ""; 
      cariListesi.forEach(cari => {
          let bolgeBadge = cari.bolge === 'Yerli' ? '<span class="badge bg-secondary">Yerli</span>' : '<span class="badge bg-info text-dark">Yabancı</span>';
          let bakiye = cari.bakiye || 0;
          let bakiyeRenk = bakiye < 0 ? 'text-danger' : (bakiye > 0 ? 'text-success' : 'text-dark');
          tbody.innerHTML += `<tr>
              <td><span class="fw-bold">${cari.unvan}</span><br><small class="text-muted">${cari.grup === 'Alici' ? 'Müşteri' : 'Tedarikçi'}</small></td>
              <td>${bolgeBadge}</td><td>${cari.ulke}</td><td>${cari.vergiNo}</td>
              <td class="${bakiyeRenk} fw-bold">${bakiye.toFixed(2)} €</td>
              <td><button class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></button></td>
          </tr>`;
      });
  };

  window.cariKaydet = async function() {
      const unvan = document.getElementById('c_unvan').value;
      const vergiNo = document.getElementById('c_vergiNo').value;
      if(unvan.trim() === "" || vergiNo.trim() === "") { alert("Ünvan ve Vergi numarası zorunludur."); return; }
      const kaydetBtn = document.querySelector("#yeniCariModal .btn-primary");
      kaydetBtn.innerHTML = "Kaydediliyor..."; kaydetBtn.disabled = true;
      try {
          await addDoc(collection(db, "cariler"), {
              unvan: unvan, grup: document.getElementById('c_grup').value, bolge: document.getElementById('c_bolge').value, 
              ulke: document.getElementById('c_ulke').value, vergiNo: vergiNo, iban: document.getElementById('c_iban').value, 
              bic: document.getElementById('c_bic').value, email: document.getElementById('c_email').value, bakiye: 0, 
              olusturmaTarihi: serverTimestamp()
          });
          bootstrap.Modal.getInstance(document.getElementById('yeniCariModal')).hide();
      } catch (error) { alert("Hata: " + error.message); } 
      finally { kaydetBtn.innerHTML = "Kaydet"; kaydetBtn.disabled = false; }
  };


  // ---------------- FATURA İŞLEMLERİ (YENİ) ----------------

  // Fatura Tablosunu Ekrana Çizme
  window.faturalariCiz = function() {
      const tbody = document.getElementById('faturaTabloGövdesi');
      if (!tbody) return; 
      tbody.innerHTML = ""; 
      
      faturaListesi.forEach(fatura => {
          let turBadge = fatura.tur === 'Satis' ? '<span class="badge bg-success">Satış</span>' : '<span class="badge bg-danger">Alım</span>';
          
          tbody.innerHTML += `
              <tr>
                  <td>${fatura.faturaNo}</td>
                  <td>${fatura.tarih}</td>
                  <td>${fatura.cariUnvan}</td>
                  <td>${turBadge}</td>
                  <td>${fatura.tutar.toFixed(2)} €</td>
                  <td>${fatura.kdvTutar.toFixed(2)} €</td>
                  <td class="fw-bold">${fatura.toplamTutar.toFixed(2)} €</td>
                  <td><span class="badge bg-secondary">Ödenmedi</span></td>
              </tr>
          `;
      });
  };

  // Yeni Fatura Modalını Açarken Carileri Listeye Doldur
  window.faturaModalAc = function() {
      const cariSelect = document.getElementById('f_cariId');
      cariSelect.innerHTML = '<option value="">-- Cari Seçiniz --</option>';
      cariListesi.forEach(cari => {
          cariSelect.innerHTML += `<option value="${cari.id}">${cari.unvan} (${cari.grup === 'Alici' ? 'Müşteri' : 'Tedarikçi'})</option>`;
      });
      // Modalı göster
      var myModal = new bootstrap.Modal(document.getElementById('yeniFaturaModal'));
      myModal.show();
  };

  // Fatura Tutarını ve KDV'yi Otomatik Hesapla
  window.hesaplaKdv = function() {
      const tutar = parseFloat(document.getElementById('f_tutar').value) || 0;
      const oran = parseFloat(document.getElementById('f_kdvOran').value) || 0;
      const kdvTutar = tutar * (oran / 100);
      const toplam = tutar + kdvTutar;
      
      document.getElementById('f_kdvTutar').value = kdvTutar.toFixed(2);
      document.getElementById('f_toplam').value = toplam.toFixed(2);
  };

  // Faturayı Veritabanına Kaydet ve Cari Bakiyeyi Güncelle
  window.faturaKaydet = async function() {
      const cariId = document.getElementById('f_cariId').value;
      const faturaNo = document.getElementById('f_faturaNo').value;
      const tarih = document.getElementById('f_tarih').value;
      const tur = document.getElementById('f_tur').value;
      const tutar = parseFloat(document.getElementById('f_tutar').value) || 0;
      const kdvTutar = parseFloat(document.getElementById('f_kdvTutar').value) || 0;
      const toplamTutar = parseFloat(document.getElementById('f_toplam').value) || 0;

      if(cariId === "" || faturaNo.trim() === "" || tarih === "" || tutar <= 0) {
          alert("Lütfen Cari, Fatura No, Tarih ve Tutar alanlarını eksiksiz giriniz.");
          return;
      }

      const kaydetBtn = document.querySelector("#yeniFaturaModal .btn-primary");
      kaydetBtn.innerHTML = "İşleniyor..."; 
      kaydetBtn.disabled = true;

      try {
          // 1. Seçilen carinin bilgilerini bul
          const secilenCari = cariListesi.find(c => c.id === cariId);
          
          // 2. Faturayı Firebase'e kaydet
          await addDoc(collection(db, "faturalar"), {
              cariId: cariId,
              cariUnvan: secilenCari.unvan,
              faturaNo: faturaNo,
              tarih: tarih,
              tur: tur,
              tutar: tutar,
              kdvOran: parseFloat(document.getElementById('f_kdvOran').value),
              kdvTutar: kdvTutar,
              toplamTutar: toplamTutar,
              durum: 'Bekliyor', // Ödendi / Bekliyor
              islemTarihi: serverTimestamp()
          });

          // 3. CARİ BAKİYESİNİ GÜNCELLEME İŞLEMİ
          let eskiBakiye = secilenCari.bakiye || 0;
          let yeniBakiye = eskiBakiye;

          if (tur === 'Satis') {
              yeniBakiye = eskiBakiye + toplamTutar; // Müşteri borçlanır, bakiye artar
          } else if (tur === 'Alim') {
              yeniBakiye = eskiBakiye - toplamTutar; // Biz borçlanırız, bakiye eksiye gider
          }

          // İlgili Cari kartın veritabanındaki referansını al ve güncelle
          const cariRef = doc(db, "cariler", cariId);
          await updateDoc(cariRef, {
              bakiye: yeniBakiye
          });

          bootstrap.Modal.getInstance(document.getElementById('yeniFaturaModal')).hide();
          document.getElementById('yeniFaturaForm').reset();

      } catch (error) {
          alert("Kayıt sırasında hata oluştu: " + error.message);
      } finally {
          kaydetBtn.innerHTML = "Kaydet"; 
          kaydetBtn.disabled = false;
      }
  };

// ---------------- BANKA VE KASA İŞLEMLERİ ----------------

  // Banka Tablosunu Çiz
  window.bankalariCiz = function() {
      const tbody = document.getElementById('bankaTabloGövdesi');
      if (!tbody) return; 
      tbody.innerHTML = ""; 
      
      bankaListesi.forEach(banka => {
          let bakiye = banka.bakiye || 0;
          tbody.innerHTML += `
              <tr>
                  <td><span class="fw-bold">${banka.hesapAdi}</span><br><small class="text-muted">${banka.bankaAdi}</small></td>
                  <td>${banka.iban || '-'}</td>
                  <td>${banka.paraBirimi}</td>
                  <td class="fw-bold fs-5 text-primary">${bakiye.toFixed(2)} ${banka.paraBirimi === 'EUR' ? '€' : ''}</td>
                  <td>
                      <button class="btn btn-sm btn-success" onclick="islemModalAc('Tahsilat', '${banka.id}')"><i class="fas fa-arrow-down"></i> Tahsilat</button>
                      <button class="btn btn-sm btn-danger" onclick="islemModalAc('Odeme', '${banka.id}')"><i class="fas fa-arrow-up"></i> Ödeme</button>
                  </td>
              </tr>
          `;
      });
  };

  // Yeni Banka/Kasa Kaydet
  window.bankaKaydet = async function() {
      const hesapAdi = document.getElementById('b_hesapAdi').value;
      const bankaAdi = document.getElementById('b_bankaAdi').value;
      const iban = document.getElementById('b_iban').value;
      
      if(hesapAdi === "") { alert("Hesap adı zorunludur!"); return; }
      
      const btn = document.querySelector("#yeniBankaModal .btn-primary");
      btn.disabled = true; btn.innerHTML = "Kaydediliyor...";

      try {
          await addDoc(collection(db, "bankalar"), {
              hesapAdi: hesapAdi,
              bankaAdi: bankaAdi,
              iban: iban,
              paraBirimi: 'EUR',
              bakiye: 0,
              olusturmaTarihi: serverTimestamp()
          });
          bootstrap.Modal.getInstance(document.getElementById('yeniBankaModal')).hide();
          document.getElementById('yeniBankaForm').reset();
      } catch(e) { alert("Hata: " + e.message); } 
      finally { btn.disabled = false; btn.innerHTML = "Kaydet"; }
  };

  // Tahsilat/Ödeme Modalını Hazırla
  window.islemModalAc = function(tur, bankaId) {
      document.getElementById('i_tur').value = tur;
      document.getElementById('i_bankaId').value = bankaId;
      document.getElementById('islemModalBaslik').innerHTML = tur === 'Tahsilat' ? 'Tahsilat Al (Giriş)' : 'Ödeme Yap (Çıkış)';
      
      // Carileri Select kutusuna doldur
      const select = document.getElementById('i_cariId');
      select.innerHTML = '<option value="">-- Cari Seçiniz --</option>';
      cariListesi.forEach(c => { select.innerHTML += `<option value="${c.id}">${c.unvan} (Bakiye: ${c.bakiye}€)</option>`; });
      
      new bootstrap.Modal(document.getElementById('islemModal')).show();
  };

  // Tahsilat veya Ödemeyi Veritabanına İşle
  window.islemKaydet = async function() {
      const tur = document.getElementById('i_tur').value; // Tahsilat veya Odeme
      const bankaId = document.getElementById('i_bankaId').value;
      const cariId = document.getElementById('i_cariId').value;
      const tutar = parseFloat(document.getElementById('i_tutar').value) || 0;
      const aciklama = document.getElementById('i_aciklama').value;

      if(!cariId || tutar <= 0) { alert("Lütfen cari seçip geçerli bir tutar girin."); return; }

      const btn = document.querySelector("#islemModal .btn-primary");
      btn.disabled = true; btn.innerHTML = "İşleniyor...";

      try {
          // 1. İşlem geçmişine kaydet
          await addDoc(collection(db, "hesapHareketleri"), {
              bankaId: bankaId,
              cariId: cariId,
              tur: tur,
              tutar: tutar,
              aciklama: aciklama,
              tarih: serverTimestamp()
          });

          // 2. Banka Bakiyesini Güncelle
          // Tahsilat ise banka artar, ödeme ise banka azalır
          const bakiyeDegisimi = tur === 'Tahsilat' ? tutar : -tutar;
          await updateDoc(doc(db, "bankalar", bankaId), {
              bakiye: increment(bakiyeDegisimi)
          });

          // 3. Cari Bakiyeyi Güncelle
          // Tahsilat aldıysak müşterinin bize borcu (bakiyesi) azalır (-tutar)
          // Ödeme yaptıysak tedarikçiye olan borcumuz (bakiyesi, yani eksideki değer) artar (+tutar)
          const cariBakiyeDegisimi = tur === 'Tahsilat' ? -tutar : tutar;
          await updateDoc(doc(db, "cariler", cariId), {
              bakiye: increment(cariBakiyeDegisimi)
          });

          bootstrap.Modal.getInstance(document.getElementById('islemModal')).hide();
          document.getElementById('islemForm').reset();
      } catch(e) { alert("Hata: " + e.message); } 
      finally { btn.disabled = false; btn.innerHTML = "İşlemi Tamamla"; }
  };

  // ---------------- VERGİ VE YASAL ÖDEME İŞLEMLERİ ----------------
  
  window.vergileriCiz = function() {
      const tbody = document.getElementById('vergiTabloGövdesi');

      const gizliGorev = "Karadağ'da (Montenegro) yabancı yatırımcıları ve özellikle Türk şirket sahiplerini ilgilendiren güncel mevzuat değişiklikleri, vergi oranları, oturum izni/çalışma izni kuralları ve Avrupa Birliği uyum yasaları hakkında en güncel gelişmeleri araştır. Sadece iş dünyasını ilgilendiren özetleri maddeler halinde, profesyonel bir iş diliyle Türkçe olarak sun.";
      document.getElementById('ai_soru').value = gizliGorev;
      geminiSoruSor(true); // true = arka plan görevi olduğunu belirtir
  };

  // Gemini'ye Soru Gönderme Fonksiyonu
  window.geminiSoruSor = async function(otomatikMi = false) {
      const apiKey = localStorage.getItem("ev_gemini_api_key");
      const soru = document.getElementById('ai_soru').value;
      const cevapEkrani = document.getElementById('ai_cevap_ekrani');
      
      if(!apiKey) { alert("Lütfen önce API Anahtarınızı girin."); return; }
      if(soru.trim() === "") { alert("Lütfen bir soru yazın."); return; }

      const btn = document.getElementById('ai_soru_buton');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analiz Ediliyor...';
      btn.disabled = true;
      
      // Ekrana soruyu yansıt (Otomatik görev değilse)
      if(!otomatikMi) {
          cevapEkrani.innerHTML += `<div class="mb-3 text-end"><span class="bg-primary text-white p-2 rounded d-inline-block shadow-sm">${soru}</span></div>`;
      } else {
          cevapEkrani.innerHTML += `<div class="mb-3 text-center"><span class="bg-warning text-dark p-2 rounded d-inline-block fw-bold shadow-sm"><i class="fas fa-search"></i> Karadağ Gündemi Taranıyor...</span></div>`;
      }
      
      document.getElementById('ai_soru').value = ""; // Kutuyu temizle

      try {
          // Google Gemini REST API'sine İstek Atıyoruz
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                  contents: [{ parts: [{ text: soru }] }]
              })
          });

          const data = await response.json();
          
          if(data.error) {
              throw new Error(data.error.message);
          }

          // Gelen cevabı formatla (Markdown yıldızlarını HTML bold etiketine çevir basitçe)
          let cevapMetni = data.candidates[0].content.parts[0].text;
          cevapMetni = cevapMetni.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

          cevapEkrani.innerHTML += `<div class="mb-3 text-start"><span class="bg-white text-dark p-3 rounded d-inline-block border shadow-sm" style="max-width: 90%;"><i class="fas fa-robot text-primary mb-2"></i> <strong>Euro Veritas AI:</strong><br>${cevapMetni}</span></div>`;
          
          // Scroll'u en aşağı indir
          cevapEkrani.scrollTop = cevapEkrani.scrollHeight;

      } catch(error) {
          cevapEkrani.innerHTML += `<div class="mb-3 text-start"><span class="bg-danger text-white p-2 rounded d-inline-block shadow-sm">Hata: ${error.message}</span></div>`;
      } finally {
          btn.innerHTML = '<i class="fas fa-paper-plane"></i> Gönder';
          btn.disabled = false;
      }
  };

</script>
