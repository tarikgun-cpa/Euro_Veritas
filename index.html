<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Veritas Doo - Montenegro</title>
    <link rel="icon" type="image/x-icon" href="EV_Logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px 20px; display: block; border-bottom: 1px solid #34495e; transition: 0.3s; }
        .sidebar a:hover { background-color: #34495e; padding-left: 25px; }
        .sidebar a i { margin-right: 10px; width: 20px; text-align: center; }
        .content-area { padding: 20px; }
        
        #login-container { min-height: 100vh; background-color: #2c3e50; }
        .login-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        @media print {
    body * { visibility: hidden; }
    .sidebar, .btn, .modal-footer, .nav { display: none !important; }
    #yazdirilacak-alan, #yazdirilacak-alan * { visibility: visible; }
    #yazdirilacak-alan { position: absolute; left: 0; top: 0; width: 100%; }
}

    </style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="login-container" class="d-flex justify-content-center align-items-center">
    <div class="card p-5 login-card bg-white" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <img src="Euro Veritas Consulting.jpg" alt="Euro Veritas Logo" style="max-width: 180px; height: auto; margin-bottom: 15px; border-radius: 10px;">
            <h4 class="text-primary fw-bold mb-0">Yönetici Paneli</h4>
        </div>
        <div id="login-error" class="alert alert-danger d-none text-center" style="font-size: 14px;"></div>
        <div class="mb-3">
            <label class="form-label text-muted small">E-Posta Adresi</label>
            <input type="email" id="login-email" class="form-control form-control-lg" placeholder="ornek@euroveritas.com">
        </div>
        <div class="mb-4">
            <label class="form-label text-muted small">Şifre</label>
            <input type="password" id="login-password" class="form-control form-control-lg" placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="girisYap()">Sisteme Giriş Yap</button>
    </div>
</div>

<!-- ANA UYGULAMA -->
<div class="container-fluid d-none" id="app-container">
    <div class="row">
        <!-- Sol Menü -->
        <div class="col-md-2 p-0 sidebar shadow">
            <div class="p-3 text-center border-bottom border-secondary mb-3" style="background-color: #ffffff;">
                <img src="Euro Veritas Consulting.jpg" alt="Euro Veritas Logo" style="max-width: 100%; height: auto; border-radius: 8px;">
            </div>
            <a href="#" onclick="sayfaYukle('dashboard')"><i class="fas fa-chart-line"></i> Yönetici Özeti</a>
            <a href="#" onclick="sayfaYukle('faturalar')"><i class="fas fa-file-invoice-dollar"></i> Faturalar</a>
            <a href="#" onclick="sayfaYukle('cariler')"><i class="fas fa-users"></i> Cari Hesaplar</a>
            <a href="#" onclick="sayfaYukle('bankalar')"><i class="fas fa-university"></i> Banka Hesapları</a>
            <a href="#" onclick="sayfaYukle('vergiler')"><i class="fas fa-landmark"></i> Vergi Ödemeleri</a>
            <a href="#" onclick="sayfaYukle('gorevler')"><i class="fas fa-tasks"></i> Görevler</a>
            <a href="#" onclick="sayfaYukle('kunye')"><i class="fas fa-building"></i> Şirket Künyesi</a>
            <a href="#" onclick="sayfaYukle('ai_asistan')" class="text-warning fw-bold"><i class="fas fa-robot"></i> AI Mevzuat Asistanı</a>
            <a href="#" class="mt-5 text-warning" onclick="cikisYap()"><i class="fas fa-sign-out-alt"></i> Güvenli Çıkış</a>
        </div>

        <!-- Ana İçerik Alanı -->
        <div class="col-md-10 content-area" id="main-content"></div>
    </div>
</div>

<!-- Firebase SDK'ları -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  // YENİ: Firebase Firestore kütüphanesine "doc" ve "updateDoc" eklendi (Bakiye güncellemek için)
  import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, increment, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

  const firebaseConfig = {
    // BURAYA KENDİ BİLGİLERİNİZİ YAPIŞTIRIN
    apiKey: "AIzaSyBOFBkfoLHyMEA5AsRVPmz8RMuyP2C3Sis",
  authDomain: "euroveritasdoo.firebaseapp.com",
  databaseURL: "https://euroveritasdoo-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "euroveritasdoo",
  storageBucket: "euroveritasdoo.firebasestorage.app",
  messagingSenderId: "789464136176",
  appId: "1:789464136176:web:49808ec9e92e7c11608535"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app); 

  let cariListesi = [];
  let faturaListesi = []; // YENİ: Faturaları tutacak dizi
  let cariDinleyici = null; 
  let faturaDinleyici = null; // YENİ: Fatura dinleyici
  let bankaListesi = [];
  let bankaDinleyici = null;
  let vergiListesi = [];
  let vergiDinleyici = null;
  let gorevListesi = [];
  let gorevDinleyici = null;
  let kunyeDinleyici = null;
  let kunyeVerisi = {};
  let islemListesi = []; // Banka hareketleri için
  let aiGecmisListesi = [];

  onAuthStateChanged(auth, (user) => {
      if (user) {
          document.getElementById('login-container').classList.add('d-none');
          document.getElementById('login-container').classList.remove('d-flex');
          document.getElementById('app-container').classList.remove('d-none');
          
          sayfaYukle('dashboard');

          // CARİLERİ DİNLE
          cariDinleyici = onSnapshot(collection(db, "cariler"), (snapshot) => {
              cariListesi = [];
              snapshot.forEach((doc) => { cariListesi.push({ id: doc.id, ...doc.data() }); });
              if (document.getElementById('cariTabloGövdesi')) { window.tabloyuCiz(); }
              if (document.getElementById('dash_kasa')) { window.dashboardCiz(); } // YENİ: Dashboard anında güncellensin
          });

          // FATURALARI DİNLE
          faturaDinleyici = onSnapshot(collection(db, "faturalar"), (snapshot) => {
              faturaListesi = [];
              snapshot.forEach((doc) => { faturaListesi.push({ id: doc.id, ...doc.data() }); });
              faturaListesi.sort((a,b) => new Date(b.tarih) - new Date(a.tarih));
              if (document.getElementById('faturaTabloGövdesi')) { window.faturalariCiz(); }
          });

          // BANKALARI DİNLE
          bankaDinleyici = onSnapshot(collection(db, "bankalar"), (snapshot) => {
              bankaListesi = [];
              snapshot.forEach((doc) => { bankaListesi.push({ id: doc.id, ...doc.data() }); });
              if (document.getElementById('bankaTabloGövdesi')) { window.bankalariCiz(); }
              if (document.getElementById('dash_kasa')) { window.dashboardCiz(); } // YENİ: Dashboard anında güncellensin
          });

          // HESAP HAREKETLERİNİ DİNLE (Eksik olan kısım)
          onSnapshot(collection(db, "hesapHareketleri"), (snapshot) => {
              islemListesi = [];
              snapshot.forEach((doc) => { islemListesi.push({ id: doc.id, ...doc.data() }); });
              islemListesi.sort((a,b) => (b.tarih?.seconds || 0) - (a.tarih?.seconds || 0));
          });

          // VERGİLERİ DİNLE (YENİ)
          vergiDinleyici = onSnapshot(collection(db, "vergiler"), (snapshot) => {
              vergiListesi = [];
              snapshot.forEach((doc) => { vergiListesi.push({ id: doc.id, ...doc.data() }); });
              // Tarihe göre sırala (Yaklaşan en üstte)
              vergiListesi.sort((a,b) => new Date(a.sonTarih) - new Date(b.sonTarih));
              if (document.getElementById('vergiTabloGövdesi')) { window.vergileriCiz(); }
          });

          // GÖREVLERİ DİNLE (YENİ)
          gorevDinleyici = onSnapshot(collection(db, "gorevler"), (snapshot) => {
              gorevListesi = [];
              snapshot.forEach((doc) => { gorevListesi.push({ id: doc.id, ...doc.data() }); });
              gorevListesi.sort((a,b) => new Date(a.sonTarih || '2099') - new Date(b.sonTarih || '2099'));
              if (document.getElementById('gorevListesiAlani')) { window.gorevleriCiz(); }
          });

          // KÜNYE DİNLE (YENİ)
          kunyeDinleyici = onSnapshot(doc(db, "ayarlar", "kunye"), (docSnap) => {
              if (docSnap.exists()) { kunyeVerisi = docSnap.data(); } 
              else { kunyeVerisi = {}; }
              if (document.getElementById('kunyeKarti')) { window.kunyeCiz(); }
          });

          // AI SOHBET GEÇMİŞİNİ DİNLE
          onSnapshot(collection(db, "aiGecmis"), (snapshot) => {
              aiGecmisListesi = [];
              snapshot.forEach((doc) => { aiGecmisListesi.push({ id: doc.id, ...doc.data() }); });
              aiGecmisListesi.sort((a,b) => (a.tarih?.seconds || 0) - (b.tarih?.seconds || 0));
              if (document.getElementById('ai_cevap_ekrani')) { window.aiGecmisCiz(); }
          });

      } else {
          document.getElementById('app-container').classList.add('d-none');
          document.getElementById('login-container').classList.remove('d-none');
          document.getElementById('login-container').classList.add('d-flex');
          
          if(cariDinleyici) cariDinleyici(); 
          if(faturaDinleyici) faturaDinleyici(); 
      }
  });

  window.girisYap = async function() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const hataKutusu = document.getElementById('login-error');
      if(email === "" || pass === "") { hataKutusu.innerHTML = "E-posta ve şifre zorunludur."; hataKutusu.classList.remove('d-none'); return; }
      try { await signInWithEmailAndPassword(auth, email, pass); hataKutusu.classList.add('d-none'); } 
      catch (error) { hataKutusu.innerHTML = "Giriş başarısız."; hataKutusu.classList.remove('d-none'); }
  };

  window.cikisYap = async function() {
      await signOut(auth);
      document.getElementById('login-email').value = ""; document.getElementById('login-password').value = "";
  };

  // AI SOHBET GEÇMİŞİNİ DİNLE
          onSnapshot(collection(db, "aiGecmis"), (snapshot) => {
              aiGecmisListesi = [];
              snapshot.forEach((doc) => { aiGecmisListesi.push({ id: doc.id, ...doc.data() }); });
              aiGecmisListesi.sort((a,b) => (a.tarih?.seconds || 0) - (b.tarih?.seconds || 0));
              if (document.getElementById('ai_cevap_ekrani')) { window.aiGecmisCiz(); }
          });

  // ---------------- YÖNETİCİ ÖZETİ (DASHBOARD) HESAPLAMALARI ----------------
  window.dashboardCiz = function() {
    if(!document.getElementById('dash_kasa_listesi')) return;

    let bankalarHtml = '';
    bankaListesi.forEach(b => {
        let sembol = b.paraBirimi === 'USD' ? '$' : '€';
        let icon = b.tur === 'Kasa' ? 'fa-box' : 'fa-university';
        bankalarHtml += `<div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-10 pb-2 mb-2">
            <span class="text-truncate pe-2 text-secondary" style="max-width: 60%;"><i class="fas ${icon} me-2"></i>${b.hesapAdi}</span>
            <strong class="fs-5 text-dark">${b.bakiye.toFixed(2)} ${sembol}</strong>
        </div>`;
    });

    let alacakHtml = ''; let borcHtml = '';
    cariListesi.forEach(c => {
        let bakiye = c.bakiye || 0;
        let sembol = (c.paraBirimi === 'USD') ? '$' : '€';
        
        let cariSatiri = `<div class="d-flex justify-content-between align-items-center bg-white p-2 rounded shadow-sm border border-light">
            <span class="text-truncate fw-medium pe-2 text-secondary" style="max-width: 65%;" title="${c.unvan}">${c.unvan}</span>
            <strong class="fs-6 text-dark">${Math.abs(bakiye).toFixed(2)} ${sembol}</strong>
        </div>`;

        if(bakiye > 0) alacakHtml += cariSatiri;
        else if(bakiye < 0) borcHtml += cariSatiri;
    });

    document.getElementById('dash_kasa_listesi').innerHTML = bankalarHtml || '<span class="text-muted">Kayıtlı kasa veya banka yok.</span>';
    document.getElementById('dash_alacak_rozetler').innerHTML = alacakHtml || '<span class="text-muted">Şu an kimseden alacağınız bulunmuyor.</span>';
    document.getElementById('dash_borc_rozetler').innerHTML = borcHtml || '<span class="text-muted">Harika! Kimseye borcunuz yok.</span>';
};

  // ---------------- CARİ İŞLEMLERİ ----------------
  window.tabloyuCiz = function() {
    const alan = document.getElementById('cariTabloGövdesi');
    if (!alan) return; 
    alan.innerHTML = '<div class="row" id="cariKartlari"></div>';
    const kartAlani = document.getElementById('cariKartlari');

    // Kurumsal pastel renk paleti
    const pastelRenkler = ['#f0f4f8', '#fdf6e3', '#f4f1f8', '#eefbf4', '#fdf4f4'];

    cariListesi.forEach((cari, index) => {
        let bakiye = cari.bakiye || 0;
        let bRenk = bakiye < 0 ? 'text-danger' : (bakiye > 0 ? 'text-success' : 'text-dark');
        let birim = cari.paraBirimi || 'EUR';
        let sembol = birim === 'USD' ? '$' : '€';
        let paraBirimiRengi = birim === 'USD' ? 'bg-success' : 'bg-primary';
        let arkaplan = pastelRenkler[index % pastelRenkler.length];

        kartAlani.innerHTML += `
            <div class="col-md-4 mb-3">
                <div class="card border-0 shadow-sm h-100 rounded-4" style="background-color: ${arkaplan};">
                    <div class="card-body cursor-pointer position-relative" onclick="cariEkstreAc('${cari.id}')">
                        <!-- Dikkat Çekici Para Birimi Rozeti -->
                        <span class="badge ${paraBirimiRengi} position-absolute top-0 end-0 m-3 px-3 py-2 shadow-sm fs-6 rounded-pill">${birim}</span>
                        
                        <h6 class="fw-bold text-truncate pe-5 mb-1" style="color: #2c3e50;" title="${cari.unvan}">${cari.unvan}</h6>
                        <small class="text-muted"><i class="fas fa-globe-europe me-1 text-secondary"></i>${cari.ulke}</small>
                        <h3 class="${bRenk} mt-3 fw-bold">${bakiye.toFixed(2)} ${sembol}</h3>
                    </div>
                    <div class="card-footer bg-transparent border-top border-secondary border-opacity-10 text-end py-2">
                        <button class="btn btn-sm btn-light text-primary shadow-sm py-0 me-1" title="Düzenle" onclick="cariDuzenleAc('${cari.id}')"><i class="fas fa-edit"></i> Düzenle</button>
                        <button class="btn btn-sm btn-light text-danger shadow-sm py-0" title="Sil" onclick="cariSil('${cari.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>`;
    });
};

    window.cariSil = async function(id) {
      if(!confirm("Bu cari hesabı silmek istediğinize emin misiniz?")) return;
      try { await deleteDoc(doc(db, "cariler", id)); } 
      catch(e) { alert("Hata: " + e.message); }
  };

  window.yeniCariAc = function() {
      document.getElementById('yeniCariForm').reset();
      document.getElementById('c_id').value = '';
      document.querySelector("#yeniCariModal .modal-title").innerHTML = "Yeni Cari Kart Oluştur";
      new bootstrap.Modal(document.getElementById('yeniCariModal')).show();
  };

    window.cariEkstreAc = async function(cariId) {
    const cari = cariListesi.find(c => c.id === cariId);
    let birim = cari.paraBirimi === 'USD' ? '$' : '€';
    
    // Faturaları ve Banka İşlemlerini Birleştir
    let hareketler = [];
    faturaListesi.filter(f => f.cariId === cariId).forEach(f => {
        hareketler.push({
            id: f.id, tipKodu: 'fatura',
            tarih: f.tarih, 
            tip: f.tur === 'Satis' ? 'Satış Faturası' : 'Alım Faturası', 
            aciklama: `Fatura No: ${f.faturaNo}`, 
            tutar: f.tur === 'Satis' ? f.toplamTutar : -f.toplamTutar,
            hamTarih: new Date(f.tarih).getTime()
        });
    });
    
    islemListesi.filter(i => i.cariId === cariId).forEach(i => {
        let d = i.tarih ? new Date(i.tarih.seconds * 1000) : new Date();
        hareketler.push({
            id: i.id, tipKodu: 'islem', bankaId: i.bankaId, orijinalTur: i.tur, // Orijinal Tür eklendi
            tarih: d.toISOString().split('T')[0], 
            tip: i.tur === 'Tahsilat' ? 'Tahsilat (Giriş)' : 'Ödeme (Çıkış)', 
            aciklama: i.aciklama || 'Banka/Kasa İşlemi', 
            tutar: i.tur === 'Tahsilat' ? -i.tutar : i.tutar,
            mutlakTutar: i.tutar, // Her zaman pozitif tutar
            hamTarih: d.getTime()
        });
    });

    hareketler.sort((a,b) => a.hamTarih - b.hamTarih); // Eskiden yeniye

    let html = `<div id="yazdirilacak-alan" class="p-4 bg-white shadow-sm rounded">
        <div class="d-flex align-items-center mb-4 border-bottom pb-2">
            <img src="Euro Veritas Consulting.jpg" style="height: 70px; margin-right: 20px;" class="d-none d-print-block">
            <div>
                <h4 class="mb-0">${cari.unvan} - Hesap Ekstresi</h4>
                <p class="mb-0"><strong>Bakiye:</strong> <span class="fs-5 ${cari.bakiye > 0 ? 'text-success' : 'text-danger'}">${cari.bakiye.toFixed(2)} ${birim}</span></p>
            </div>
        </div>
        <p><strong>Bakiye:</strong> <span class="fs-5 ${cari.bakiye > 0 ? 'text-success' : 'text-danger'}">${cari.bakiye.toFixed(2)} ${birim}</span></p>
        <table class="table table-sm table-striped mt-3">
            <thead class="table-dark"><tr><th>Tarih</th><th>İşlem Tipi</th><th>Açıklama</th><th class="text-end">Tutar</th><th class="d-print-none text-center">Sil</th></tr></thead>
            <tbody>`;
            
    if(hareketler.length === 0) {
        html += `<tr><td colspan="5" class="text-center text-muted">Geçmiş hareket bulunamadı.</td></tr>`;
    } else {
        hareketler.forEach(h => {
            let renk = h.tutar > 0 ? 'text-success' : 'text-danger';
            let silButon = h.tipKodu === 'islem' ? 
                `<button class="btn btn-sm btn-outline-danger py-0" onclick="islemSil('${h.id}', '${cariId}', '${h.bankaId}', '${h.orijinalTur}', ${h.mutlakTutar})" title="Banka işlemini sil"><i class="fas fa-trash"></i></button>` : 
                `<span class="badge bg-light text-muted">Faturalardan silin</span>`;
                
            html += `<tr>
                <td>${h.tarih}</td><td>${h.tip}</td><td>${h.aciklama}</td>
                <td class="text-end fw-bold ${renk}">${h.tutar.toFixed(2)} ${birim}</td>
                <td class="d-print-none text-center">${silButon}</td>
            </tr>`;
        });
    }
    html += `</tbody></table></div>`;
    html += `<div class="mt-3"><button class="btn btn-secondary shadow-sm" onclick="window.print()"><i class="fas fa-print"></i> Yazdır</button> <button class="btn btn-outline-danger ms-2" onclick="sayfaYukle('cariler')">Kapat</button></div>`;
    
    document.getElementById('main-content').innerHTML = html;
};

// YENİ EKLENEN: Ekstreden Banka İşlemi Silme (Bakiye düzeltmeli)
window.islemSil = async function(islemId, cariId, bankaId, tur, islemTutari) {
      if(!confirm("Bu banka hareketini silmek istediğinize emin misiniz? Cari ve Banka bakiyeleri otomatik olarak iade edilecektir.")) return;
      try {
          // Tutarı her ihtimale karşı mutlak (pozitif) değere çeviriyoruz
          let tutar = Math.abs(parseFloat(islemTutari)); 
          await deleteDoc(doc(db, "hesapHareketleri", islemId));

          // Tahsilat silinince: Bankadan para çıkar (-), Cari borcu artar (+)
          // Ödeme silinince: Bankaya para girer (+), Cari borcu azalır (-)
          const bankaFarki = tur === 'Tahsilat' ? -tutar : tutar;
          const cariFarki = tur === 'Tahsilat' ? tutar : -tutar;

          await updateDoc(doc(db, "cariler", cariId), { bakiye: increment(cariFarki) });
          await updateDoc(doc(db, "bankalar", bankaId), { bakiye: increment(bankaFarki) });

          // Açık olan ekranı kapatıp listeyi yenile
          document.getElementById('main-content').innerHTML = '<div class="alert alert-success mt-4">İşlem başarıyla silindi ve bakiyeler güncellendi. Sol menüden listeye dönebilirsiniz.</div>';
      } catch(e) { alert("Hata: " + e.message); }
  };

  window.cariDuzenleAc = function(id) {
      const c = cariListesi.find(x => x.id === id);
      document.getElementById('c_id').value = c.id;
      document.getElementById('c_unvan').value = c.unvan; document.getElementById('c_paraBirimi').value = c.paraBirimi || 'EUR';
      document.getElementById('c_grup').value = c.grup; document.getElementById('c_bolge').value = c.bolge;
      document.getElementById('c_ulke').value = c.ulke; document.getElementById('c_vergiNo').value = c.vergiNo;
      document.getElementById('c_iban').value = c.iban; document.getElementById('c_bic').value = c.bic;
      document.getElementById('c_email').value = c.email;
      document.querySelector("#yeniCariModal .modal-title").innerHTML = "Cari Düzenle";
      new bootstrap.Modal(document.getElementById('yeniCariModal')).show();
  };

  window.cariKaydet = async function() {
      const id = document.getElementById('c_id').value; // HTML'de formun içine <input type="hidden" id="c_id"> eklemelisiniz.
      const unvan = document.getElementById('c_unvan').value;
      if(unvan.trim() === "") { alert("Ünvan zorunludur."); return; }
      const data = {
          unvan: unvan, paraBirimi: document.getElementById('c_paraBirimi').value, grup: document.getElementById('c_grup').value,

  window.faturaSil = async function(faturaId, cariId, tur, toplamTutar) {
      if(!confirm("Bu faturayı silmek istediğinize emin misiniz? Cari bakiye otomatik olarak geri alınacaktır.")) return;
      try {
          let tutar = Math.abs(parseFloat(toplamTutar)); // Kesinlikle pozitif sayıya çevir
          await deleteDoc(doc(db, "faturalar", faturaId));
          // Satis faturası silindiğinde cari borcu azalır (-)
          // Alim faturası silindiğinde cari borcu (alacağımız) artar (+)
          const bakiyeDegisimi = tur === 'Satis' ? -tutar : tutar;
          await updateDoc(doc(db, "cariler", cariId), { bakiye: increment(bakiyeDegisimi) });
      } catch(e) { alert("Hata: " + e.message); }
  };

  // Fatura Tutarını ve KDV'yi Otomatik Hesapla
  window.hesaplaKdv = function() {
      const tutar = parseFloat(document.getElementById('f_tutar').value) || 0;
      const oran = parseFloat(document.getElementById('f_kdvOran').value) || 0;
      const kdvTutar = tutar * (oran / 100);
      const toplam = tutar + kdvTutar;
      
      document.getElementById('f_kdvTutar').value = kdvTutar.toFixed(2);
      document.getElementById('f_toplam').value = toplam.toFixed(2);
  };

  // Faturayı Veritabanına Kaydet ve Cari Bakiyeyi Güncelle
  window.faturaKaydet = async function() {
      const id = document.getElementById('f_id').value; // Gizli ID
      const cariId = document.getElementById('f_cariId').value;
      const faturaNo = document.getElementById('f_faturaNo').value;
      const tarih = document.getElementById('f_tarih').value;
      const tur = document.getElementById('f_tur').value;
      const paraBirimi = document.getElementById('f_paraBirimi').value;
      const tutar = parseFloat(document.getElementById('f_tutar').value) || 0;
      const kdvOran = parseFloat(document.getElementById('f_kdvOran').value) || 0;
      const kdvTutar = parseFloat(document.getElementById('f_kdvTutar').value) || 0;
      const toplamTutar = parseFloat(document.getElementById('f_toplam').value) || 0;

      if(cariId === "" || faturaNo.trim() === "" || tarih === "" || tutar <= 0) {
          alert("Lütfen Cari, Fatura No, Tarih ve Tutar alanlarını eksiksiz giriniz."); return;
      }

      const kaydetBtn = document.querySelector("#yeniFaturaModal .btn-primary");
      kaydetBtn.innerHTML = "İşleniyor..."; kaydetBtn.disabled = true;

      try {
          const secilenCari = cariListesi.find(c => c.id === cariId);
          const yeniBakiyeDegisimi = tur === 'Satis' ? toplamTutar : -toplamTutar; // Müşteri borçlanır (+), Biz borçlanırız (-)

          if (id) {
              // DÜZENLEME İŞLEMİ (Önce eski bakiye etkisini geri alıyoruz)
              const eskiFatura = faturaListesi.find(f => f.id === id);
              if(eskiFatura) {
                  const eskiBakiyeIadesi = eskiFatura.tur === 'Satis' ? -eskiFatura.toplamTutar : eskiFatura.toplamTutar;
                  await updateDoc(doc(db, "cariler", eskiFatura.cariId), { bakiye: increment(eskiBakiyeIadesi) });
              }
              // Faturayı yeni verilerle güncelle
              await updateDoc(doc(db, "faturalar", id), {
                  cariId: cariId, cariUnvan: secilenCari.unvan, faturaNo: faturaNo, tarih: tarih, tur: tur, paraBirimi: paraBirimi, tutar: tutar, kdvOran: kdvOran, kdvTutar: kdvTutar, toplamTutar: toplamTutar
              });
              // Yeni tutarı cariye yansıt
              await updateDoc(doc(db, "cariler", cariId), { bakiye: increment(yeniBakiyeDegisimi) });

          } else {
              // SIFIRDAN YENİ FATURA EKLEME İŞLEMİ
              await addDoc(collection(db, "faturalar"), {
                  cariId: cariId, cariUnvan: secilenCari.unvan, faturaNo: faturaNo, tarih: tarih, tur: tur, paraBirimi: paraBirimi, tutar: tutar, kdvOran: kdvOran, kdvTutar: kdvTutar, toplamTutar: toplamTutar, durum: 'Bekliyor', islemTarihi: serverTimestamp()
              });
              // Tutarı cariye yansıt
              await updateDoc(doc(db, "cariler", cariId), { bakiye: increment(yeniBakiyeDegisimi) });
          }

          bootstrap.Modal.getInstance(document.getElementById('yeniFaturaModal')).hide();
          document.getElementById('yeniFaturaForm').reset();
          document.getElementById('f_id').value = '';
      } catch (error) { alert("Kayıt sırasında hata oluştu: " + error.message); } 
      finally { kaydetBtn.innerHTML = "Faturayı İşle"; kaydetBtn.disabled = false; }
  };

  // Tahsilat veya Ödemeyi Veritabanına İşle
  window.islemKaydet = async function() {
      const tur = document.getElementById('i_tur').value; // Tahsilat veya Odeme
      const bankaId = document.getElementById('i_bankaId').value;
      const cariId = document.getElementById('i_cariId').value;
      const tutar = parseFloat(document.getElementById('i_tutar').value) || 0;
      const aciklama = document.getElementById('i_aciklama').value;

      if(!cariId || tutar <= 0) { alert("Lütfen cari seçip geçerli bir tutar girin."); return; }

      const btn = document.querySelector("#islemModal .btn-primary");
      btn.disabled = true; btn.innerHTML = "İşleniyor...";

      try {
          // 1. İşlem geçmişine kaydet
          await addDoc(collection(db, "hesapHareketleri"), {
              bankaId: bankaId,
              cariId: cariId,
              tur: tur,
              tutar: tutar,
              aciklama: aciklama,
              tarih: new Date(document.getElementById('i_tarih').value)
          });

          // 2. Banka Bakiyesini Güncelle
          // Tahsilat ise banka artar, ödeme ise banka azalır
          const bakiyeDegisimi = tur === 'Tahsilat' ? tutar : -tutar;
          await updateDoc(doc(db, "bankalar", bankaId), {
              bakiye: increment(bakiyeDegisimi)
          });

          // 3. Cari Bakiyeyi Güncelle
          // Tahsilat aldıysak müşterinin bize borcu (bakiyesi) azalır (-tutar)
          // Ödeme yaptıysak tedarikçiye olan borcumuz (bakiyesi, yani eksideki değer) artar (+tutar)
          const cariBakiyeDegisimi = tur === 'Tahsilat' ? -tutar : tutar;
          await updateDoc(doc(db, "cariler", cariId), {
              bakiye: increment(cariBakiyeDegisimi)
          });

          bootstrap.Modal.getInstance(document.getElementById('islemModal')).hide();
          document.getElementById('islemForm').reset();
      } catch(e) { alert("Hata: " + e.message); } 
      finally { btn.disabled = false; btn.innerHTML = "İşlemi Tamamla"; }

      const bugun = new Date().toLocaleDateString('tr-TR');
      const gizliGorev = `Bugünün tarihi: ${bugun}. Karadağ'da (Montenegro) yabancı yatırımcıları ve Türk şirket sahiplerini ilgilendiren yakın zamanlı mevzuat değişiklikleri, vergi oranları ve AB uyum yasaları hakkında son gelişmeleri araştır. Maddeler halinde özetle.`;

  window.aiGecmisCiz = function() {
      const ekran = document.getElementById('ai_cevap_ekrani');
      if(!ekran) return;
      let html = `<div class="text-center text-muted mt-3 mb-4"><i class="fas fa-shield-alt fa-2x mb-2"></i><br>Euro Veritas Akıllı Ajanına Hoş Geldiniz.<br>Geçmiş analizleriniz aşağıdadır.</div>`;
      
      aiGecmisListesi.forEach(g => {
          let d = g.tarih ? new Date(g.tarih.seconds * 1000).toLocaleString('tr-TR') : '';
          html += `<div class="mb-3 text-end"><span class="bg-primary text-white p-2 rounded d-inline-block shadow-sm text-start" style="max-width: 85%;"><strong>Siz (${d}):</strong><br>${g.soru}</span></div>`;
          html += `<div class="mb-3 text-start"><span class="bg-white text-dark p-3 rounded d-inline-block border shadow-sm" style="max-width: 90%;"><i class="fas fa-robot text-primary mb-2"></i> <strong>Euro Veritas AI:</strong><br>${g.cevap}</span></div>`;
      });
      ekran.innerHTML = html;
      ekran.scrollTop = ekran.scrollHeight;
  };

  window.geminiSoruSor = async function(otomatikMi = false) {
      const apiKey = localStorage.getItem("ev_gemini_api_key");
      const soru = document.getElementById('ai_soru').value;
      
      if(!apiKey) { alert("Lütfen API Anahtarınızı girin."); return; }
      if(soru.trim() === "") { alert("Lütfen bir soru yazın."); return; }

      const btn = document.getElementById('ai_soru_buton');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...'; btn.disabled = true;
      document.getElementById('ai_soru').value = ""; 

      try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: soru }] }] })
          });
          const data = await response.json();
          if(data.error) throw new Error(data.error.message);

          let cevapMetni = data.candidates[0].content.parts[0].text;
          cevapMetni = cevapMetni.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

          // Firebase'e kaydet
          await addDoc(collection(db, "aiGecmis"), {
              soru: otomatikMi ? "Sistem: Karadağ Gündemini Tara" : soru,
              cevap: cevapMetni,
              tarih: serverTimestamp()
          });
      } catch(error) { alert("AI Hatası: " + error.message); } 
      finally { btn.innerHTML = '<i class="fas fa-paper-plane"></i> Gönder'; btn.disabled = false; }
  };
</script>
