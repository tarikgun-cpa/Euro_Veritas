<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Veritas Doo - Montenegro</title>
    <link rel="icon" type="image/x-icon" href="EV_Logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px 20px; display: block; border-bottom: 1px solid #34495e; transition: 0.3s; }
        .sidebar a:hover { background-color: #34495e; padding-left: 25px; }
        .sidebar a i { margin-right: 10px; width: 20px; text-align: center; }
        .content-area { padding: 20px; }
        
        #login-container { min-height: 100vh; background-color: #2c3e50; }
        .login-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        @media print {
            body * { visibility: hidden; }
            .sidebar, .btn, .modal-footer, .nav { display: none !important; }
            #yazdirilacak-alan, #yazdirilacak-alan * { visibility: visible; }
            #yazdirilacak-alan { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="login-container" class="d-flex justify-content-center align-items-center">
    <div class="card p-5 login-card bg-white" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <img src="Euro Veritas Consulting.jpg" alt="Euro Veritas Logo" style="max-width: 180px; height: auto; margin-bottom: 15px; border-radius: 10px;">
            <h4 class="text-primary fw-bold mb-0">Yönetici Paneli</h4>
        </div>
        <div id="login-error" class="alert alert-danger d-none text-center" style="font-size: 14px;"></div>
        <div class="mb-3">
            <label class="form-label text-muted small">E-Posta Adresi</label>
            <input type="email" id="login-email" class="form-control form-control-lg" placeholder="ornek@euroveritas.com">
        </div>
        <div class="mb-4">
            <label class="form-label text-muted small">Şifre</label>
            <input type="password" id="login-password" class="form-control form-control-lg" placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="girisYap()">Sisteme Giriş Yap</button>
    </div>
</div>

<!-- ANA UYGULAMA -->
<div class="container-fluid d-none" id="app-container">
    <div class="row">
        <!-- Sol Menü -->
        <div class="col-md-2 p-0 sidebar shadow">
            <div class="p-3 text-center border-bottom border-secondary mb-3" style="background-color: #ffffff;">
                <img src="Euro Veritas Consulting.jpg" alt="Euro Veritas Logo" style="max-width: 100%; height: auto; border-radius: 8px;">
            </div>
            <a href="#" onclick="sayfaYukle('dashboard')"><i class="fas fa-chart-line"></i> Yönetici Özeti</a>
            <a href="#" onclick="sayfaYukle('faturalar')"><i class="fas fa-file-invoice-dollar"></i> Faturalar</a>
            <a href="#" onclick="sayfaYukle('cariler')"><i class="fas fa-users"></i> Cari Hesaplar</a>
            <a href="#" onclick="sayfaYukle('bankalar')"><i class="fas fa-university"></i> Banka Hesapları</a>
            <a href="#" onclick="sayfaYukle('vergiler')"><i class="fas fa-landmark"></i> Vergi Ödemeleri</a>
            <a href="#" onclick="sayfaYukle('gorevler')"><i class="fas fa-tasks"></i> Görevler</a>
            <a href="#" onclick="sayfaYukle('kunye')"><i class="fas fa-building"></i> Şirket Künyesi</a>
            <a href="#" onclick="sayfaYukle('ai_asistan')" class="text-warning fw-bold"><i class="fas fa-robot"></i> AI Mevzuat Asistanı</a>
            <a href="#" class="mt-5 text-warning" onclick="cikisYap()"><i class="fas fa-sign-out-alt"></i> Güvenli Çıkış</a>
        </div>

        <!-- Ana İçerik Alanı -->
        <div class="col-md-10 content-area" id="main-content"></div>
    </div>
</div>

<!-- Firebase SDK'ları ve İşlem Mantığı -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, increment, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBOFBkfoLHyMEA5AsRVPmz8RMuyP2C3Sis",
    authDomain: "euroveritasdoo.firebaseapp.com",
    databaseURL: "https://euroveritasdoo-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "euroveritasdoo",
    storageBucket: "euroveritasdoo.firebasestorage.app",
    messagingSenderId: "789464136176",
    appId: "1:789464136176:web:49808ec9e92e7c11608535"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app); 

  let cariListesi = [];
  let faturaListesi = [];
  let bankaListesi = [];
  let vergiListesi = [];
  let gorevListesi = [];
  let kunyeVerisi = {};
  let islemListesi = [];
  let aiGecmisListesi = [];
  
  let cariDinleyici = null; 
  let faturaDinleyici = null; 

  onAuthStateChanged(auth, (user) => {
      if (user) {
          document.getElementById('login-container').classList.add('d-none');
          document.getElementById('login-container').classList.remove('d-flex');
          document.getElementById('app-container').classList.remove('d-none');
          
          sayfaYukle('dashboard');

          // CARİLERİ DİNLE (NaN Oto-Düzeltme Eklendi)
          cariDinleyici = onSnapshot(collection(db, "cariler"), (snapshot) => {
              cariListesi = [];
              snapshot.forEach((docSnap) => { 
                  let data = docSnap.data();
                  if(Number.isNaN(data.bakiye) || data.bakiye === null) {
                      updateDoc(doc(db, "cariler", docSnap.id), { bakiye: 0 });
                      data.bakiye = 0;
                  }
                  cariListesi.push({ id: docSnap.id, ...data }); 
              });
              if (document.getElementById('cariTabloGövdesi')) { window.tabloyuCiz(); }
              if (typeof window.dashboardCiz === 'function') { window.dashboardCiz(); }
          });

          // FATURALARI DİNLE
          faturaDinleyici = onSnapshot(collection(db, "faturalar"), (snapshot) => {
              faturaListesi = [];
              snapshot.forEach((docSnap) => { faturaListesi.push({ id: docSnap.id, ...docSnap.data() }); });
              faturaListesi.sort((a,b) => new Date(b.tarih) - new Date(a.tarih));
              if (document.getElementById('satisTabloGövdesi')) { window.faturalariCiz(); }
              if (typeof window.dashboardCiz === 'function') { window.dashboardCiz(); }
          });

          // BANKALARI DİNLE (NaN Oto-Düzeltme Eklendi)
          onSnapshot(collection(db, "bankalar"), (snapshot) => {
              bankaListesi = [];
              snapshot.forEach((docSnap) => { 
                  let data = docSnap.data();
                  if(Number.isNaN(data.bakiye) || data.bakiye === null) {
                      updateDoc(doc(db, "bankalar", docSnap.id), { bakiye: 0 });
                      data.bakiye = 0;
                  }
                  bankaListesi.push({ id: docSnap.id, ...data }); 
              });
              if (document.getElementById('bankaTabloGövdesi')) { window.bankalariCiz(); }
              if (typeof window.dashboardCiz === 'function') { window.dashboardCiz(); }
          });

          // HESAP HAREKETLERİNİ DİNLE
          onSnapshot(collection(db, "hesapHareketleri"), (snapshot) => {
              islemListesi = [];
              snapshot.forEach((doc) => { islemListesi.push({ id: doc.id, ...doc.data() }); });
              islemListesi.sort((a,b) => (b.tarih?.seconds || 0) - (a.tarih?.seconds || 0));
          });

          // VERGİLERİ DİNLE
          onSnapshot(collection(db, "vergiler"), (snapshot) => {
              vergiListesi = [];
              snapshot.forEach((doc) => { vergiListesi.push({ id: doc.id, ...doc.data() }); });
              vergiListesi.sort((a,b) => new Date(a.sonTarih) - new Date(b.sonTarih));
              if (document.getElementById('vergiTabloGövdesi')) { window.vergileriCiz(); }
          });

          // GÖREVLERİ DİNLE
          onSnapshot(collection(db, "gorevler"), (snapshot) => {
              gorevListesi = [];
              snapshot.forEach((doc) => { gorevListesi.push({ id: doc.id, ...doc.data() }); });
              gorevListesi.sort((a,b) => new Date(a.sonTarih || '2099') - new Date(b.sonTarih || '2099'));
              if (document.getElementById('gorevListesiAlani')) { window.gorevleriCiz(); }
          });

          // KÜNYE DİNLE
          onSnapshot(doc(db, "ayarlar", "kunye"), (docSnap) => {
              if (docSnap.exists()) { kunyeVerisi = docSnap.data(); } 
              else { kunyeVerisi = {}; }
              if (document.getElementById('kunyeKarti')) { window.kunyeCiz(); }
          });

          // AI SOHBET GEÇMİŞİNİ DİNLE
          onSnapshot(collection(db, "aiGecmis"), (snapshot) => {
              aiGecmisListesi = [];
              snapshot.forEach((doc) => { aiGecmisListesi.push({ id: doc.id, ...doc.data() }); });
              aiGecmisListesi.sort((a,b) => (a.tarih?.seconds || 0) - (b.tarih?.seconds || 0));
              if (document.getElementById('ai_cevap_ekrani')) { window.aiGecmisCiz(); }
          });

      } else {
          document.getElementById('app-container').classList.add('d-none');
          document.getElementById('login-container').classList.remove('d-none');
          document.getElementById('login-container').classList.add('d-flex');
          
          if(cariDinleyici) cariDinleyici(); 
          if(faturaDinleyici) faturaDinleyici(); 
      }
  });

  window.girisYap = async function() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const hataKutusu = document.getElementById('login-error');
      if(email === "" || pass === "") { hataKutusu.innerHTML = "E-posta ve şifre zorunludur."; hataKutusu.classList.remove('d-none'); return; }
      try { await signInWithEmailAndPassword(auth, email, pass); hataKutusu.classList.add('d-none'); } 
      catch (error) { hataKutusu.innerHTML = "Giriş başarısız."; hataKutusu.classList.remove('d-none'); }
  };

  window.cikisYap = async function() {
      await signOut(auth);
      document.getElementById('login-email').value = ""; document.getElementById('login-password').value = "";
  };


  // ---------------- YÖNETİCİ ÖZETİ (DASHBOARD) HESAPLAMALARI ----------------
  window.dashboardCiz = function() {
    if(!document.getElementById('dash_kasa_listesi')) return;
    let seciliYil = document.getElementById('dash_yil_secici') ? document.getElementById('dash_yil_secici').value : new Date().getFullYear().toString();

    // Banka ve Kasa
    let bankalarHtml = '';
    bankaListesi.forEach(b => {
        let sembol = b.paraBirimi === 'USD' ? '$' : '€';
        let icon = b.tur === 'Kasa' ? 'fa-box' : 'fa-university';
        bankalarHtml += `<div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-10 pb-1 mb-1">
            <span class="text-truncate pe-2 text-muted small" style="max-width: 60%;"><i class="fas ${icon} me-2"></i>${b.hesapAdi}</span>
            <strong class="fs-6 text-dark">${b.bakiye.toFixed(2)} ${sembol}</strong></div>`;
    });

    // Cari Rozetler
    let alacakHtml = ''; let borcHtml = '';
    cariListesi.forEach(c => {
        let bakiye = c.bakiye || 0;
        let sembol = (c.paraBirimi === 'USD') ? '$' : '€';
        let cariSatiri = `<div class="d-flex justify-content-between align-items-center bg-white p-2 rounded shadow-sm border border-light">
            <span class="text-truncate fw-medium pe-2 text-secondary small" style="max-width: 65%;" title="${c.unvan}">${c.unvan}</span>
            <strong class="small text-dark">${Math.abs(bakiye).toFixed(2)} ${sembol}</strong></div>`;
        if(bakiye > 0) alacakHtml += cariSatiri; else if(bakiye < 0) borcHtml += cariSatiri;
    });

    document.getElementById('dash_kasa_listesi').innerHTML = bankalarHtml || '<span class="text-muted small">Kayıtlı veri yok.</span>';
    document.getElementById('dash_alacak_rozetler').innerHTML = alacakHtml || '<span class="text-muted small">Alacak bulunmuyor.</span>';
    document.getElementById('dash_borc_rozetler').innerHTML = borcHtml || '<span class="text-muted small">Borç bulunmuyor.</span>';

    // Kâr/Zarar Hesaplama
    let aylar = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
    let aylikVeri = Array(12).fill(null).map(() => ({ gelir: 0, gider: 0 }));

    faturaListesi.forEach(f => {
        if(!f.tarih) return;
        let [y, m] = f.tarih.split('-');
        if(y === seciliYil && f.paraBirimi === 'EUR') { 
            let ayIndex = parseInt(m) - 1;
            if(f.tur === 'Satis') aylikVeri[ayIndex].gelir += f.toplamTutar;
            else if(f.tur === 'Alim') aylikVeri[ayIndex].gider += f.toplamTutar;
        }
    });

    let kzHtml = '';
    let toplamGelir = 0; let toplamGider = 0;
    aylikVeri.forEach((veri, index) => {
        if(veri.gelir > 0 || veri.gider > 0) {
            toplamGelir += veri.gelir; toplamGider += veri.gider;
            let net = veri.gelir - veri.gider;
            let renk = net > 0 ? 'text-success' : (net < 0 ? 'text-danger' : 'text-muted');
            kzHtml += `<tr>
                <td class="text-muted fw-bold small">${aylar[index]}</td>
                <td class="text-end text-success small">+${veri.gelir.toFixed(2)} €</td>
                <td class="text-end text-danger small">-${veri.gider.toFixed(2)} €</td>
                <td class="text-end fw-bold ${renk} small">${net > 0 ? '+' : ''}${net.toFixed(2)} €</td>
            </tr>`;
        }
    });

    if(kzHtml === '') kzHtml = '<tr><td colspan="4" class="text-center text-muted small py-3">Bu yıla ait Euro cinsi fatura kaydı bulunamadı.</td></tr>';
    else {
        let genelNet = toplamGelir - toplamGider;
        let genelRenk = genelNet > 0 ? 'text-success' : (genelNet < 0 ? 'text-danger' : 'text-dark');
        kzHtml += `<tr class="table-light border-top border-2 border-dark">
            <td class="fw-bold small">GENEL TOPLAM</td>
            <td class="text-end text-success fw-bold small">+${toplamGelir.toFixed(2)} €</td>
            <td class="text-end text-danger fw-bold small">-${toplamGider.toFixed(2)} €</td>
            <td class="text-end fw-bold ${genelRenk} fs-6">${genelNet > 0 ? '+' : ''}${genelNet.toFixed(2)} €</td>
        </tr>`;
    }
    document.getElementById('dash_kar_zarar').innerHTML = kzHtml;
  };


  // ---------------- CARİ İŞLEMLERİ ----------------
  window.tabloyuCiz = function() {
    const alan = document.getElementById('cariTabloGövdesi');
    if (!alan) return; 
    alan.innerHTML = '<div class="row" id="cariKartlari"></div>';
    const kartAlani = document.getElementById('cariKartlari');

    const pastelRenkler = ['#f8fafc', '#f0fdf4', '#fef2f2', '#fffbeb', '#f5f3ff'];

    cariListesi.forEach((cari, index) => {
        let bakiye = cari.bakiye || 0;
        let bRenk = bakiye < 0 ? 'text-danger' : (bakiye > 0 ? 'text-success' : 'text-dark');
        let birim = cari.paraBirimi || 'EUR';
        let sembol = birim === 'USD' ? '$' : '€';
        let paraBirimiRengi = birim === 'USD' ? 'bg-success' : 'bg-primary';
        let arkaplan = pastelRenkler[index % pastelRenkler.length];

        kartAlani.innerHTML += `
            <div class="col-md-4 mb-3">
                <div class="card border-0 shadow-sm h-100 rounded-4" style="background-color: ${arkaplan}; border: 1px solid rgba(0,0,0,0.05) !important;">
                    <div class="card-body cursor-pointer position-relative" onclick="cariEkstreAc('${cari.id}')">
                        <span class="badge ${paraBirimiRengi} position-absolute top-0 end-0 m-3 px-3 py-2 shadow-sm fs-6 rounded-pill">${birim}</span>
                        
                        <h6 class="fw-bold text-truncate pe-5 mb-1" style="color: #1e293b;" title="${cari.unvan}">${cari.unvan}</h6>
                        <small class="text-muted"><i class="fas fa-globe-europe me-1 text-secondary"></i>${cari.ulke}</small>
                        <h3 class="${bRenk} mt-3 fw-bold">${bakiye.toFixed(2)} ${sembol}</h3>
                    </div>
                    <div class="card-footer bg-transparent border-top border-secondary border-opacity-10 text-end py-2">
                        <button class="btn btn-sm btn-light text-primary shadow-sm py-0 me-1" title="Düzenle" onclick="cariDuzenleAc('${cari.id}')"><i class="fas fa-edit"></i> Düzenle</button>
                        <button class="btn btn-sm btn-light text-danger shadow-sm py-0" title="Sil" onclick="cariSil('${cari.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>`;
    });
  };

  window.cariSil = async function(id) {
      if(!confirm("Bu cari hesabı silmek istediğinize emin misiniz?")) return;
      try { await deleteDoc(doc(db, "cariler", id)); } 
      catch(e) { alert("Hata: " + e.message); }
  };

  window.yeniCariAc = function() {
      document.getElementById('yeniCariForm').reset();
      document.getElementById('c_id').value = '';
      document.querySelector("#yeniCariModal .modal-title").innerHTML = "Yeni Cari Kart Oluştur";
      new bootstrap.Modal(document.getElementById('yeniCariModal')).show();
  };

  window.cariEkstreAc = async function(cariId, reRender = false) {
    const cari = cariListesi.find(c => c.id === cariId);
    let birim = cari.paraBirimi === 'USD' ? '$' : '€';
    
    let basTarih = reRender && document.getElementById('ex_bas') ? document.getElementById('ex_bas').value : '';
    let bitTarih = reRender && document.getElementById('ex_bit') ? document.getElementById('ex_bit').value : '';

    let hareketler = [];
    faturaListesi.filter(f => f.cariId === cariId).forEach(f => {
        if(basTarih && f.tarih < basTarih) return;
        if(bitTarih && f.tarih > bitTarih) return;
        hareketler.push({ id: f.id, tipKodu: 'fatura', tarih: f.tarih, tip: f.tur === 'Satis' ? 'Satış Faturası' : 'Alım Faturası', 
            aciklama: `Fatura No: ${f.faturaNo}`, tutar: f.tur === 'Satis' ? f.toplamTutar : -f.toplamTutar, hamTarih: new Date(f.tarih).getTime() });
    });
    
    islemListesi.filter(i => i.cariId === cariId).forEach(i => {
        let dStr = i.tarih ? new Date(i.tarih.seconds * 1000).toISOString().split('T')[0] : '';
        if(basTarih && dStr < basTarih) return;
        if(bitTarih && dStr > bitTarih) return;
        hareketler.push({ id: i.id, tipKodu: 'islem', bankaId: i.bankaId, orijinalTur: i.tur, tarih: dStr, tip: i.tur === 'Tahsilat' ? 'Tahsilat (Giriş)' : 'Ödeme (Çıkış)', 
            aciklama: i.aciklama || 'Banka/Kasa İşlemi', tutar: i.tur === 'Tahsilat' ? -i.tutar : i.tutar, mutlakTutar: i.tutar, hamTarih: new Date(dStr).getTime() });
    });
    hareketler.sort((a,b) => a.hamTarih - b.hamTarih); 

    let toplamBorc = 0; let toplamAlacak = 0;
    
    if(!reRender) {
        let gercekBakiye = 0;
        let tamHareketler = [...faturaListesi.filter(f => f.cariId === cariId).map(f => f.tur === 'Satis' ? f.toplamTutar : -f.toplamTutar), 
                             ...islemListesi.filter(i => i.cariId === cariId).map(i => i.tur === 'Tahsilat' ? -i.tutar : i.tutar)];
        tamHareketler.forEach(t => gercekBakiye += t);
        if (parseFloat(gercekBakiye.toFixed(2)) !== parseFloat((cari.bakiye || 0).toFixed(2))) {
            updateDoc(doc(db, "cariler", cariId), { bakiye: gercekBakiye }); cari.bakiye = gercekBakiye;
        }
    }

    let html = `<div id="yazdirilacak-alan" class="p-4 bg-white shadow-sm rounded border border-light">
        <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
            <div class="d-flex align-items-center">
                <img src="Euro Veritas Consulting.jpg" style="height: 60px; margin-right: 20px;" class="d-none d-print-block">
                <div><h4 class="mb-0 text-dark fw-bold">${cari.unvan}</h4><small class="text-muted">Cari Hesap Ekstresi</small></div>
            </div>
            <div class="text-end"><h6 class="mb-0 text-muted small">Güncel Kapanış Bakiyesi</h6><h4 class="${cari.bakiye > 0 ? 'text-success' : (cari.bakiye < 0 ? 'text-danger' : 'text-dark')} fw-bold mb-0">${Math.abs(cari.bakiye).toFixed(2)} ${birim} ${cari.bakiye > 0 ? '(Alacaklıyız)' : (cari.bakiye < 0 ? '(Borçluyuz)' : '')}</h4></div>
        </div>
        
        <div class="row mb-3 d-print-none bg-light p-2 rounded mx-0">
            <div class="col-md-4"><label class="small text-muted">Başlangıç Tarihi</label><input type="date" id="ex_bas" class="form-control form-control-sm" value="${basTarih}"></div>
            <div class="col-md-4"><label class="small text-muted">Bitiş Tarihi</label><input type="date" id="ex_bit" class="form-control form-control-sm" value="${bitTarih}"></div>
            <div class="col-md-4 d-flex align-items-end"><button class="btn btn-sm btn-primary w-100" onclick="cariEkstreAc('${cariId}', true)"><i class="fas fa-filter"></i> Tarihe Göre Filtrele</button></div>
        </div>

        <div class="table-responsive">
        <table class="table table-sm table-hover align-middle">
            <thead class="table-light text-muted small border-bottom border-dark border-2"><tr><th>Tarih</th><th>İşlem Tipi</th><th>Açıklama</th><th class="text-end">Borç (Debit)</th><th class="text-end">Alacak (Credit)</th><th class="d-print-none text-center">İşlem</th></tr></thead>

  window.faturaKaydet = async function() {
      const id = document.getElementById('f_id').value; const cariId = document.getElementById('f_cariId').value;
      const faturaNo = document.getElementById('f_faturaNo').value; const tarih = document.getElementById('f_tarih').value;
      const tur = document.getElementById('f_tur').value; const paraBirimi = document.getElementById('f_paraBirimi').value;
      const tutar = parseFloat(document.getElementById('f_tutar').value) || 0; const kdvOran = parseFloat(document.getElementById('f_kdvOran').value) || 0;
      const kdvTutar = parseFloat(document.getElementById('f_kdvTutar').value) || 0; const toplamTutar = parseFloat(document.getElementById('f_toplam').value) || 0;
      const aciklama = document.getElementById('f_aciklama').value || '';

      if(cariId === "" || faturaNo.trim() === "" || tarih === "" || tutar <= 0) { alert("Lütfen Cari, Fatura No, Tarih ve Tutar giriniz."); return; }
      const kaydetBtn = document.querySelector("#yeniFaturaModal .btn-primary"); kaydetBtn.innerHTML = "İşleniyor..."; kaydetBtn.disabled = true;

      try {
          const secilenCari = cariListesi.find(c => c.id === cariId);
          const yeniBakiyeDegisimi = tur === 'Satis' ? toplamTutar : -toplamTutar; 

          if (id) {
              const eskiFatura = faturaListesi.find(f => f.id === id);
              if(eskiFatura) {
                  const eskiBakiyeIadesi = eskiFatura.tur === 'Satis' ? -eskiFatura.toplamTutar : eskiFatura.toplamTutar;
                  await updateDoc(doc(db, "cariler", eskiFatura.cariId), { bakiye: increment(eskiBakiyeIadesi) });
              }
              await updateDoc(doc(db, "faturalar", id), { cariId: cariId, cariUnvan: secilenCari.unvan, faturaNo: faturaNo, tarih: tarih, tur: tur, paraBirimi: paraBirimi, tutar: tutar, kdvOran: kdvOran, kdvTutar: kdvTutar, toplamTutar: toplamTutar, aciklama: aciklama });
              await updateDoc(doc(db, "cariler", cariId), { bakiye: increment(yeniBakiyeDegisimi) });
          } else {
              await addDoc(collection(db, "faturalar"), { cariId: cariId, cariUnvan: secilenCari.unvan, faturaNo: faturaNo, tarih: tarih, tur: tur, paraBirimi: paraBirimi, tutar: tutar, kdvOran: kdvOran, kdvTutar: kdvTutar, toplamTutar: toplamTutar, aciklama: aciklama, durum: 'Bekliyor', islemTarihi: serverTimestamp() });
              await updateDoc(doc(db, "cariler", cariId), { bakiye: increment(yeniBakiyeDegisimi) });
          }
          bootstrap.Modal.getInstance(document.getElementById('yeniFaturaModal')).hide();
          document.getElementById('yeniFaturaForm').reset(); document.getElementById('f_id').value = '';
      } catch (error) { alert("Hata: " + error.message); } finally { kaydetBtn.innerHTML = "Faturayı İşle"; kaydetBtn.disabled = false; }
  };

 window.bankaEkstreAc = async function(bankaId, reRender = false) {
      const banka = bankaListesi.find(b => b.id === bankaId);
      let birim = banka.paraBirimi === 'USD' ? '$' : '€';
      
      let basTarih = reRender && document.getElementById('ex_banka_bas') ? document.getElementById('ex_banka_bas').value : '';
      let bitTarih = reRender && document.getElementById('ex_banka_bit') ? document.getElementById('ex_banka_bit').value : '';

      let tamHareketler = islemListesi.filter(i => i.bankaId === bankaId);
      
      if(!reRender) {
          let hesaplananBankaBakiye = 0;
          tamHareketler.forEach(h => { hesaplananBankaBakiye += (h.tur === 'Tahsilat' ? h.tutar : -h.tutar); });
          hesaplananBankaBakiye = parseFloat(hesaplananBankaBakiye.toFixed(2));
          let mevcutBankaBakiye = parseFloat((banka.bakiye || 0).toFixed(2));
          if(hesaplananBankaBakiye !== mevcutBankaBakiye) {
              updateDoc(doc(db, "bankalar", bankaId), { bakiye: hesaplananBankaBakiye });
              banka.bakiye = hesaplananBankaBakiye;
          }
      }

      let filtrelenmisHareketler = tamHareketler.filter(h => {
          let dStr = h.tarih ? new Date(h.tarih.seconds * 1000).toISOString().split('T')[0] : '';
          if(basTarih && dStr < basTarih) return false;
          if(bitTarih && dStr > bitTarih) return false;
          return true;
      });

      let toplamGiris = 0; let toplamCikis = 0;

      let html = `<div id="yazdirilacak-alan" class="p-4 bg-white shadow-sm rounded border border-light">
          <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
              <div class="d-flex align-items-center">
                  <img src="Euro Veritas Consulting.jpg" style="height: 60px; margin-right: 20px;" class="d-none d-print-block">
                  <div><h4 class="mb-0 text-dark fw-bold">${banka.hesapAdi}</h4><small class="text-muted">Banka/Kasa Ekstresi</small></div>
              </div>
              <div class="text-end"><h6 class="mb-0 text-muted small">Güncel Kapanış Bakiyesi</h6><h4 class="${banka.bakiye >= 0 ? 'text-success' : 'text-danger'} fw-bold mb-0">${banka.bakiye.toFixed(2)} ${birim}</h4></div>
          </div>
          
          <div class="row mb-3 d-print-none bg-light p-2 rounded mx-0">
              <div class="col-md-4"><label class="small text-muted">Başlangıç Tarihi</label><input type="date" id="ex_banka_bas" class="form-control form-control-sm" value="${basTarih}"></div>
              <div class="col-md-4"><label class="small text-muted">Bitiş Tarihi</label><input type="date" id="ex_banka_bit" class="form-control form-control-sm" value="${bitTarih}"></div>
              <div class="col-md-4 d-flex align-items-end"><button class="btn btn-sm btn-primary w-100" onclick="bankaEkstreAc('${bankaId}', true)"><i class="fas fa-filter"></i> Tarihe Göre Filtrele</button></div>
          </div>

          <div class="table-responsive">
          <table class="table table-sm table-hover align-middle">
              <thead class="table-light text-muted small border-bottom border-dark border-2"><tr><th>Tarih</th><th>İşlem Yönü</th><th>Cari Unvan (Kime/Kimden)</th><th>Açıklama</th><th class="text-end">Giriş (+)</th><th class="text-end">Çıkış (-)</th><th class="d-print-none text-center">İptal</th></tr></thead>
              <tbody>`;
              
      if(filtrelenmisHareketler.length === 0) { html += `<tr><td colspan="7" class="text-center text-muted py-3">Bu tarih aralığında işlem bulunamadı.</td></tr>`; } 
      else {
          filtrelenmisHareketler.forEach(h => {
              let d = h.tarih ? new Date(h.tarih.seconds * 1000).toLocaleDateString('tr-TR') : '-';
              let cariAdi = h.cariId === "VERGI_DAIRESI" ? "Vergi / Yasal Kurum" : (cariListesi.find(c => c.id === h.cariId)?.unvan || 'Silinmiş Cari');
              let girisStr = '-'; let cikisStr = '-';

              else if(h.tur === 'Odeme') { cikisStr = `${h.tutar.toFixed(2)} ${birim}`; toplamCikis += h.tutar; }
              
              let silButon = `<button class="btn btn-sm btn-outline-danger py-0" onclick="islemSil('${h.id}', '${h.cariId}', '${h.bankaId}', '${h.tur}', ${h.tutar})" title="İşlemi İptal Et"><i class="fas fa-trash"></i></button>`;
              
              html += `<tr><td class="small">${d}</td><td class="small text-muted">${h.tur}</td><td class="small">${cariAdi}</td><td class="small">${h.aciklama}</td><td class="text-end fw-medium text-success">${girisStr}</td><td class="text-end fw-medium text-danger">${cikisStr}</td><td class="d-print-none text-center">${silButon}</td></tr>`;
          });
      }
      html += `<tr class="table-light border-top border-dark border-2"><td colspan="4" class="text-end fw-bold small text-muted">DÖNEM TOPLAMI:</td><td class="text-end fw-bold text-success">${toplamGiris.toFixed(2)} ${birim}</td><td class="text-end fw-bold text-danger">${toplamCikis.toFixed(2)} ${birim}</td><td class="d-print-none"></td></tr>`;
      html += `</tbody></table></div></div>`;
      html += `<div class="mt-3"><button class="btn btn-secondary shadow-sm" onclick="window.print()"><i class="fas fa-print"></i> Yazdır</button> <button class="btn btn-outline-danger ms-2" onclick="sayfaYukle('bankalar')">Kapat</button></div>`;

  window.islemSil = async function(islemId, cariId, bankaId, tur, islemTutari) {
      if(!confirm("Bu banka hareketini silmek istediğinize emin misiniz? Cari ve Banka bakiyeleri otomatik olarak iade edilecektir.")) return;
      try {
          let tutar = Math.abs(parseFloat(islemTutari));

          const bankaFarki = tur === 'Tahsilat' ? -tutar : tutar;

          await updateDoc(doc(db, "cariler", cariId), { bakiye: increment(cariFarki) });
          await updateDoc(doc(db, "bankalar", bankaId), { bakiye: increment(bankaFarki) });

          document.getElementById('main-content').innerHTML = '<div class="alert alert-success mt-4">İşlem başarıyla silindi ve bakiyeler güncellendi. Sol menüden listeye dönebilirsiniz.</div>';

  window.geminiSoruSor = async function(otomatikMi = false) {
      const apiKey = localStorage.getItem("ev_gemini_api_key");
      const soru = document.getElementById('ai_soru').value;
      
      if(!apiKey) { alert("Lütfen API Anahtarınızı girin."); return; }
      if(soru.trim() === "") { alert("Lütfen bir soru yazın."); return; }

      const btn = document.getElementById('ai_soru_buton');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>...'; btn.disabled = true;
      document.getElementById('ai_soru').value = ""; 

      try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: soru }] }] })
          });
          const data = await response.json();
          if(data.error) throw new Error(data.error.message);

          let cevapMetni = data.candidates[0].content.parts[0].text;
          cevapMetni = cevapMetni.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

          await addDoc(collection(db, "aiGecmis"), {
              soru: otomatikMi ? "Sistem: Karadağ Gündemini Tara" : soru,
              cevap: cevapMetni,
              tarih: serverTimestamp()
          });
      } catch(error) { alert("AI Hatası: " + error.message); } 
      finally { btn.innerHTML = '<i class="fas fa-paper-plane"></i> Gönder'; btn.disabled = false; }
  };
</script>

                <!-- KÜNYE DÜZENLEME MODALI -->
                <div class="modal fade" id="kunyeModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header bg-dark text-white">
                                <h5 class="modal-title">Firma Bilgilerini Düzenle</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="kunyeForm">
                                    <div class="row mb-2">
                                        <div class="col-md-4"><label class="form-label small">Kısa Ünvan</label><input type="text" class="form-control form-control-sm" id="k_unvan"></div>
                                        <div class="col-md-8"><label class="form-label small">Tam Resmi Ünvan</label><input type="text" class="form-control form-control-sm" id="k_tamUnvan"></div>
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col-md-4"><label class="form-label small">PIB (Vergi No)</label><input type="text" class="form-control form-control-sm" id="k_pib"></div>
                                        <div class="col-md-4"><label class="form-label small">Matični Broj</label><input type="text" class="form-control form-control-sm" id="k_sicilNo"></div>
                                        <div class="col-md-4"><label class="form-label small">Kayıtlı Adres</label><input type="text" class="form-control form-control-sm" id="k_adres"></div>
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col-md-3"><label class="form-label small">Ana Faaliyet</label><input type="text" class="form-control form-control-sm" id="k_faaliyet"></div>
                                        <div class="col-md-3"><label class="form-label small">İcra Direktörü</label><input type="text" class="form-control form-control-sm" id="k_direktor"></div>
                                        <div class="col-md-3"><label class="form-label small">Kuruluş Tarihi</label><input type="date" class="form-control form-control-sm" id="k_kurulus"></div>
                                        <div class="col-md-3"><label class="form-label small">Sermaye (€)</label><input type="text" class="form-control form-control-sm" id="k_sermaye"></div>
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col-md-12"><label class="form-label small">Web Sitesi</label><input type="text" class="form-control form-control-sm" id="k_web" placeholder="www.euroveritas.com"></div>
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col-md-6"><label class="form-label small">E-Posta 1</label><input type="email" class="form-control form-control-sm" id="k_email1"></div>
                                        <div class="col-md-6"><label class="form-label small">E-Posta 2</label><input type="email" class="form-control form-control-sm" id="k_email2"></div>
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col-md-6"><label class="form-label small">Telefon 1</label><input type="text" class="form-control form-control-sm" id="k_telefon1"></div>
                                        <div class="col-md-6"><label class="form-label small">Telefon 2</label><input type="text" class="form-control form-control-sm" id="k_telefon2"></div>
                                    </div>

                                    <h6 class="border-bottom pb-2 text-primary mt-3">Banka Bilgileri</h6>
                                    <div class="row mb-2">
                                        <div class="col-md-12"><label class="form-label small">Banka Adı</label><input type="text" class="form-control form-control-sm" id="k_banka"></div>
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col-md-12"><label class="form-label small">EUR IBAN Numarası (Uluslararası / Swift İçin)</label><input type="text" class="form-control form-control-sm" id="k_iban" placeholder="ME..."></div>
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col-md-6"><label class="form-label small">Yerel Hesap No (Karadağ İçi)</label><input type="text" class="form-control form-control-sm" id="k_yerelHesap" placeholder="520-..."></div>
                                        <div class="col-md-6"><label class="form-label small">USD IBAN Numarası</label><input type="text" class="form-control form-control-sm" id="k_usdIban"></div>
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col-md-6"><label class="form-label small">SWIFT Kodu</label><input type="text" class="form-control form-control-sm" id="k_swift"></div>
                                    </div>
                                    <h6 class="border-bottom pb-2 text-danger mt-3">Dijital Sistemler ve Şifreler</h6>
                                    <div class="row mb-2">
                                        <div class="col-md-12">
                                            <label class="form-label small">e-Fatura, Vergi Dairesi, Banka vb. Şifreler</label>
                                            <textarea class="form-control form-control-sm" id="k_sifreler" rows="4" placeholder="Kullanıcı adı ve şifrelerinizi alt alta yazabilirsiniz..."></textarea>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                                <button type="button" class="btn btn-primary" onclick="kunyeKaydet()">Kaydet</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => { if(typeof window.kunyeCiz === 'function') window.kunyeCiz(); }, 50);
        }

        else if(sayfa === 'ai_asistan') {
            const hasApiKey = localStorage.getItem("ev_gemini_api_key") ? true : false;
            
            mainContent.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-robot text-warning"></i> AI Mevzuat Asistanı</h2>
                    <button class="btn btn-warning shadow-sm fw-bold" onclick="gundemiAnalizEt()">
                        <i class="fas fa-bolt"></i> Karadağ Gündemini Tara
                    </button>
                </div>

                <!-- API KEY GİRİŞ ALANI (Sadece ilk girişte görünür) -->
                <div class="card shadow-sm mb-4 border-warning ${hasApiKey ? 'd-none' : ''}" id="ai_ayar_alani">
                    <div class="card-body bg-light">
                        <h5 class="text-danger"><i class="fas fa-lock"></i> Sistemin Kurulumu Gerekli</h5>
                        <p class="text-muted small">Asistanın çalışabilmesi için ücretsiz Google Gemini API anahtarına ihtiyacınız var. Bu anahtar sadece sizin tarayıcınızda kalır, kimseyle paylaşılmaz.</p>
                        <div class="input-group">
                            <input type="text" id="ai_api_key" class="form-control" placeholder="AIzaSy... ile başlayan anahtarınızı buraya yapıştırın">
                            <button class="btn btn-primary" onclick="geminiApiKaydet()">Kaydet ve Başlat</button>
                        </div>
                        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="small mt-2 d-inline-block">Ücretsiz API Anahtarı Almak İçin Tıklayın</a>
                    </div>
                </div>

                <!-- SOHBET EKRANI -->
                <div class="card shadow-sm border-0 ${!hasApiKey ? 'd-none' : ''}" id="ai_sohbet_alani" style="height: 65vh; display: flex; flex-direction: column;">
                    <div class="card-body" id="ai_cevap_ekrani" style="flex: 1; overflow-y: auto; background-color: #e9ecef; border-radius: 5px 5px 0 0;">
                        <div class="text-center text-muted mt-3 mb-4">
                            <i class="fas fa-shield-alt fa-2x mb-2"></i><br>
                            Euro Veritas Akıllı Ajanına Hoş Geldiniz.<br>
                            Karadağ yasaları, AB uyum süreçleri veya şirket yönetimi hakkında sorular sorabilir ya da sağ üstteki <strong>"Gündemi Tara"</strong> butonuna basabilirsiniz.
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0 p-3">
                        <div class="input-group">
                            <textarea id="ai_soru" class="form-control" placeholder="Karadağ'daki yeni vergi yasaları neler? (Enter tuşu ile yollayabilirsiniz)" rows="2"></textarea>
                            <button class="btn btn-primary px-4" id="ai_soru_buton" onclick="geminiSoruSor()">
                                <i class="fas fa-paper-plane"></i> Gönder
                            </button>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => { if(typeof window.aiGecmisCiz === 'function') window.aiGecmisCiz(); }, 50);
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
